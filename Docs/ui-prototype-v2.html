<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>游迹 App · UI 原型 V0.1</title>
<style>
/* ============================================================
   Ocean Mist 雾海蓝 — 浅色模式
   #06425C / #4A90A4 / #A8D5BA / #F4F1DE
   ============================================================ */
html[data-theme="light"]{
  --bg-primary:#FFFFFF;
  --bg-secondary:#F2F6F8;
  --bg-elevated:#FFFFFF;
  --bg-tint:#F4F1DE;
  --bg-fill:rgba(6,66,92,.08);
  --bg-fill-strong:rgba(6,66,92,.14);

  --accent-primary:#06425C;
  --accent-secondary:#4A90A4;
  --accent-tertiary:#A8D5BA;
  --on-accent:#FFFFFF;

  --text-primary:#0C1F29;
  --text-secondary:#5A6B75;
  --text-tertiary:#93A1A9;
  --text-inverse:#FFFFFF;

  --separator:rgba(60,60,67,.16);
  --separator-strong:rgba(60,60,67,.29);

  --ok:#1E7A4D;      --ok-bg:rgba(46,167,110,.12);
  --warn:#A8630B;    --warn-bg:rgba(255,159,10,.14);
  --dispute:#A03246; --dispute-bg:rgba(255,59,48,.10);
  --none:#7B8790;    --none-bg:rgba(120,120,128,.10);

  --hero-from:#0A506B;
  --hero-to:#06425C;
  --hero-title:#FFFFFF;
  --hero-sub:rgba(255,255,255,.72);

  --shadow-sm:0 1px 3px rgba(6,26,36,.06);
  --shadow-md:0 6px 20px -4px rgba(6,26,36,.12);
  --shadow-nav:0 .5px 0 0 var(--separator);

  --page-bg:#12232B;
  --page-fg:#E6EEF2;
  --page-muted:#8FA6B0;
}

/* ============================================================
   Ocean Mist 雾海蓝 — 深色模式（背景反转，accent 提亮）
   ============================================================ */
html[data-theme="dark"]{
  --bg-primary:#08161C;
  --bg-secondary:#0F2530;
  --bg-elevated:#122C38;
  --bg-tint:#1B3A45;
  --bg-fill:rgba(127,196,217,.12);
  --bg-fill-strong:rgba(127,196,217,.20);

  --accent-primary:#7FC4D9;
  --accent-secondary:#5FA8BC;
  --accent-tertiary:#A8D5BA;
  --on-accent:#06222D;

  --text-primary:#EAF2F5;
  --text-secondary:#9FB4BE;
  --text-tertiary:#6B818C;
  --text-inverse:#08161C;

  --separator:rgba(235,235,245,.12);
  --separator-strong:rgba(235,235,245,.22);

  --ok:#4AD98C;      --ok-bg:rgba(74,217,140,.14);
  --warn:#FFB340;    --warn-bg:rgba(255,179,64,.14);
  --dispute:#FF7B85; --dispute-bg:rgba(255,123,133,.14);
  --none:#8A979F;    --none-bg:rgba(138,151,159,.12);

  --hero-from:#0E4459;
  --hero-to:#0A2E3C;
  --hero-title:#FFFFFF;
  --hero-sub:rgba(255,255,255,.70);

  --shadow-sm:0 1px 3px rgba(0,0,0,.30);
  --shadow-md:0 6px 20px -4px rgba(0,0,0,.45);
  --shadow-nav:0 .5px 0 0 var(--separator);

  --page-bg:#E9EFF2;
  --page-fg:#12232B;
  --page-muted:#5A6B75;
}

*{box-sizing:border-box;-webkit-font-smoothing:antialiased}
.phone-mockup h1,.phone-mockup h2,.phone-mockup h3,.phone-mockup p{margin:0}
html,body{margin:0;padding:0;min-height:100%}
body{
  background:var(--page-bg);
  color:var(--page-fg);
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;
  font-size:17px;line-height:1.47;
  transition:background .35s ease,color .35s ease;
}

/* ---------- 4pt grid / 移动端间距 token ---------- */
:root{
  --margin-page:16px;
  --gap-card:12px;
  --padding-card:16px;
  --radius-card:20px;
  --radius-sm:12px;
  --radius-lg:28px;
  --tabbar-h:49px;
  --navbar-h:44px;
  --spring:cubic-bezier(.34,1.56,.64,1);
}

.page{padding:0 var(--margin-page)}
.section{
  padding:0 var(--margin-page) var(--gap-card);
  display:flex;flex-direction:column;
}
.section__header{
  display:flex;align-items:baseline;justify-content:space-between;
  margin-bottom:var(--gap-card);
}
.section__header h3{
  font-size:17px;font-weight:600;letter-spacing:-.43px;margin:0;
  color:var(--text-primary);   /* 手机内跟随主题 token，舞台内由下方规则覆盖 */
}
.stage .section__header h3{color:var(--page-fg)}

/* ---------- 舞台 ---------- */
.stage{
  min-height:100dvh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:20px;padding:40px 20px 32px;
}
.stage__meta{text-align:center;max-width:430px}
.stage__meta h1{font-size:20px;font-weight:600;letter-spacing:-.43px;margin:0 0 4px}
.stage__meta p{font-size:13px;line-height:1.4;color:var(--page-muted);margin:0}

/* ---------- 手机原型：直角矩形，固定 430×900 ---------- */
.phone-mockup{
  width:430px;height:900px;flex:none;
  background:var(--bg-primary);
  color:var(--text-primary);   /* 显式前景色：防止舞台深色对比底被继承进手机 */
  border-radius:0;
  overflow:hidden;
  position:relative;
  display:flex;flex-direction:column;
  box-shadow:0 20px 60px rgba(0,0,0,.28);
  transition:background .35s ease;
}
.app__scroll{
  flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  background:var(--bg-secondary);
  padding-top:var(--navbar-h);   /* 导航栏为悬浮层，滚动区让出高度 */
}
/* 沉浸式：Hero 顶到导航栏下沿（导航栏浮在其上） */
.app__scroll.is-immersive{padding-top:0;background:var(--bg-primary)}
.app__scroll.is-immersive .spot-hero{margin-top:0}
/* 有吸底操作栏的页面，尾部留出安全高度 */
.app__scroll.has-dock{padding-bottom:calc(var(--tabbar-h) + 34px + 78px)}
.app__scroll::-webkit-scrollbar{display:none}

/* ---------- 状态栏（双击切主题） ---------- */
.status-bar{
  height:44px;flex:none;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 20px 0 24px;
  font-size:13px;font-weight:600;letter-spacing:-.08px;
  color:var(--text-primary);
  background:var(--bg-primary);
  cursor:pointer;user-select:none;-webkit-user-select:none;
  position:relative;z-index:30;
  transition:background .35s ease,color .35s ease;
}
.status-bar__time{font-variant-numeric:tabular-nums;min-width:52px}
.status-bar__right{display:flex;align-items:center;gap:5px}
.status-bar::after{
  content:'双击状态栏切换深色';
  position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);
  padding:5px 12px;background:var(--accent-primary);color:var(--on-accent);
  font-size:11px;font-weight:600;border-radius:999px;white-space:nowrap;
  pointer-events:none;opacity:0;z-index:60;
  box-shadow:0 4px 12px rgba(0,0,0,.22);
  animation:hintFade 4.8s ease-out .6s 1 both;
}
html[data-theme="dark"] .status-bar::after{content:'双击状态栏切换浅色'}
@keyframes hintFade{
  0%{opacity:0;transform:translate(-50%,-4px)}
  14%{opacity:1;transform:translate(-50%,0)}
  78%{opacity:1;transform:translate(-50%,0)}
  100%{opacity:0;transform:translate(-50%,-4px)}
}

/* ---------- 导航栏 44pt + 毛玻璃 ---------- */
.nav-bar{
  height:var(--navbar-h);flex:none;
  display:flex;align-items:center;gap:8px;padding:0 12px;
  position:absolute;left:0;right:0;top:44px;z-index:25;
  background:color-mix(in srgb,var(--bg-primary) 72%,transparent);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  backdrop-filter:saturate(180%) blur(20px);
  box-shadow:var(--shadow-nav);
  transition:background .35s ease,color .35s ease;
}
/* 沉浸式页：导航栏压深色 Hero，文字转浅色 */
.phone-mockup:has(.is-immersive) .nav-bar{
  background:transparent;box-shadow:none;
  -webkit-backdrop-filter:none;backdrop-filter:none;
  color:#fff;
}
.phone-mockup:has(.is-immersive) .nav-bar__title{color:#fff}
.phone-mockup:has(.is-immersive) .nav-btn{color:#fff}
.nav-bar__title{
  flex:1;text-align:center;font-size:17px;font-weight:600;letter-spacing:-.43px;
  color:var(--text-primary);
}
.nav-btn{
  width:38px;height:38px;flex:none;
  display:flex;align-items:center;justify-content:center;
  border:none;background:transparent;cursor:pointer;
  color:var(--accent-primary);border-radius:var(--radius-sm);
  transition:transform .18s var(--spring),opacity .18s;
}
.nav-btn:active{transform:scale(.9);opacity:.6}
.nav-btn svg{width:20px;height:20px}
.nav-btn--ph{width:38px;flex:none}

/* ---------- Tab Bar：flex 兄弟节点，非 absolute ---------- */
.tab-bar{
  flex:none;min-height:calc(var(--tabbar-h) + 34px);
  padding:6px 0 34px;
  display:grid;grid-template-columns:repeat(5,1fr);
  background:color-mix(in srgb,var(--bg-primary) 78%,transparent);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  backdrop-filter:saturate(180%) blur(20px);
  box-shadow:0 -.5px 0 0 var(--separator);
  transition:background .35s ease;
}
.tab-bar__item{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  border:none;background:transparent;cursor:pointer;
  color:var(--text-tertiary);font-size:10px;font-weight:500;letter-spacing:.07px;
  padding:4px 0;transition:color .2s,transform .18s var(--spring);
}
.tab-bar__item:active{transform:scale(.92)}
.tab-bar__item.is-active{color:var(--accent-primary)}
.tab-bar__item svg{width:23px;height:23px}

/* ---------- Hero：full-bleed 贴边，0 圆角 ---------- */
.hero{
  margin:0 0 var(--gap-card);
  width:100%;
  aspect-ratio:16/9.5;
  max-height:300px;
  border-radius:0;
  position:relative;overflow:hidden;
  background:linear-gradient(165deg,var(--hero-from),var(--hero-to));
  display:flex;flex-direction:column;justify-content:flex-end;
  padding:20px var(--margin-page) 18px;
}
.hero::before{
  content:'';position:absolute;top:-30px;right:-30px;
  width:0;height:0;
  border-left:110px solid transparent;
  border-right:110px solid transparent;
  border-bottom:190px solid rgba(255,255,255,.055);
}
.hero::after{
  content:'';position:absolute;bottom:-20px;left:28px;
  width:0;height:0;
  border-left:80px solid transparent;
  border-right:80px solid transparent;
  border-bottom:130px solid rgba(168,213,186,.05);
}
.hero__body{position:relative;z-index:2}
.hero__eyebrow{
  font-size:12px;font-weight:600;letter-spacing:.4px;
  color:var(--hero-sub);text-transform:uppercase;margin:0 0 4px;
}
.hero__title{
  font-size:28px;line-height:34px;font-weight:700;letter-spacing:.36px;
  color:var(--hero-title);margin:0 0 6px;
}
.hero__meta{
  font-size:13px;color:var(--hero-sub);margin:0;
  display:flex;align-items:center;gap:6px;
}
.hero__meta svg{width:13px;height:13px;flex:none}

/* ---------- 卡片 ---------- */
.card{
  border-radius:var(--radius-card);
  padding:var(--padding-card);
  background:var(--bg-elevated);
  border:1px solid var(--separator);
  box-shadow:var(--shadow-sm);
  margin-bottom:var(--gap-card);
  transition:transform .2s var(--spring),box-shadow .2s;
}
.card--tap{cursor:pointer;display:block;width:100%;text-align:left;font:inherit;color:inherit}
.card--tap:hover{transform:translateY(-1px);box-shadow:var(--shadow-md)}
.card--tap:active{transform:scale(.985)}
.card--feature{
  background:linear-gradient(150deg,var(--accent-primary),var(--hero-from));
  border:none;color:var(--hero-title);
}
.card--tint{background:var(--bg-tint);border-color:transparent}
/* 标题显式前景色：深浅模式各自跟随 token，避免继承舞台色 */
.card h3,.card .stack h3{color:var(--text-primary)}
.card--feature h3{color:var(--hero-title)}
.phone-mockup .section__header h3{color:var(--text-primary)}
.phone-mockup .stat__l,.phone-mockup .field__lb,.phone-mockup .field__vl{color:var(--text-secondary)}

.row{display:flex;align-items:center;gap:8px}
.row--between{justify-content:space-between}
.row--wrap{flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:2px}
.muted{color:var(--text-secondary)}
.faint{color:var(--text-tertiary)}

/* ---------- 按钮 ---------- */
.btn{
  display:flex;align-items:center;justify-content:center;gap:6px;
  width:100%;min-height:50px;padding:13px 20px;
  border:none;border-radius:14px;cursor:pointer;
  font-family:inherit;font-size:17px;font-weight:600;letter-spacing:-.43px;
  background:var(--accent-primary);color:var(--on-accent);
  transition:transform .18s var(--spring),opacity .18s,filter .18s;
}
.btn:active{transform:scale(.975);opacity:.88}
.btn--tinted{background:var(--bg-fill-strong);color:var(--accent-primary)}
.btn--sm{min-height:38px;padding:8px 16px;font-size:15px;border-radius:11px;width:auto}
.btn svg{width:18px;height:18px}

/* ---------- Chips / 分段控件 ---------- */
.seg{
  display:flex;padding:2px;border-radius:11px;background:var(--bg-fill);
  position:relative;
}
.seg__btn{
  flex:1;min-height:34px;border:none;background:transparent;cursor:pointer;
  font-family:inherit;font-size:13px;font-weight:600;letter-spacing:-.08px;
  color:var(--text-secondary);border-radius:9px;
  transition:background .22s,color .22s,box-shadow .22s;
}
.seg__btn.is-active{
  background:var(--bg-elevated);color:var(--accent-primary);box-shadow:var(--shadow-sm);
}
.chip{
  display:inline-flex;align-items:center;gap:4px;
  min-height:34px;padding:6px 13px;border-radius:999px;
  background:var(--bg-elevated);border:1px solid var(--separator);
  font-size:14px;font-weight:500;color:var(--text-primary);cursor:pointer;
  font-family:inherit;
  transition:transform .16s var(--spring),background .2s,border-color .2s;
}
.chip:active{transform:scale(.94)}
.chip.is-on{background:var(--accent-primary);color:var(--on-accent);border-color:transparent}

/* ---------- 核验徽章 ---------- */
.verified{
  display:inline-flex;align-items:center;gap:4px;flex:none;
  height:22px;padding:0 8px;border-radius:999px;
  font-size:11px;font-weight:600;letter-spacing:-.08px;
}
.verified__dot{width:5px;height:5px;border-radius:50%;flex:none}
.verified--ok{background:var(--ok-bg);color:var(--ok)}
.verified--ok .verified__dot{background:var(--ok)}
.verified--warn{background:var(--warn-bg);color:var(--warn)}
.verified--warn .verified__dot{background:var(--warn)}
.verified--dispute{background:var(--dispute-bg);color:var(--dispute)}
.verified--dispute .verified__dot{background:var(--dispute)}
.verified--none{background:var(--none-bg);color:var(--none)}
.verified--none .verified__dot{background:var(--none)}

/* ---------- 预算条 ---------- */
.budget{margin-top:10px}
.budget__nums{
  display:flex;align-items:baseline;justify-content:space-between;margin-bottom:7px;
}
.budget__val{font-size:20px;font-weight:700;letter-spacing:-.43px;color:var(--text-primary)}
.budget__cap{font-size:12px;color:var(--text-secondary)}
.budget__track{height:8px;border-radius:4px;background:var(--bg-fill);overflow:hidden}
.budget__fill{height:100%;border-radius:4px;background:var(--accent-primary);width:0;transition:width .7s var(--spring)}

/* ---------- 时间轴 ---------- */
.timeline{position:relative;padding-left:22px}
.timeline::before{
  content:'';position:absolute;left:5px;top:8px;bottom:14px;width:2px;
  background:var(--separator-strong);border-radius:1px;
}
.tl-item{position:relative;margin-bottom:var(--gap-card)}
.tl-item::before{
  content:'';position:absolute;left:-22px;top:17px;
  width:12px;height:12px;border-radius:50%;
  background:var(--accent-primary);
  box-shadow:0 0 0 3px var(--bg-secondary);
}
.tl-item--muted::before{background:var(--bg-fill-strong)}
.tl-time{
  font-size:12px;font-weight:600;letter-spacing:-.08px;
  color:var(--text-tertiary);font-variant-numeric:tabular-nums;margin:0 0 5px;
}

/* ---------- 交通段 ---------- */
.transit{
  display:flex;align-items:center;gap:7px;
  padding:0 0 12px 0;margin:0;
  font-size:12px;color:var(--text-secondary);
}
.transit svg{width:14px;height:14px;flex:none;color:var(--text-tertiary)}

/* ---------- 提醒 ---------- */
.alert{
  display:flex;gap:10px;align-items:flex-start;
  border-radius:var(--radius-sm);padding:12px 14px;
  background:var(--warn-bg);margin-bottom:var(--gap-card);
  font-size:13px;line-height:1.4;color:var(--text-primary);
}
.alert svg{width:16px;height:16px;flex:none;color:var(--warn);margin-top:1px}
.alert b{color:var(--warn);font-weight:600}

/* ---------- 滚动容器：置于 .section 内 ---------- */
.product-scroll{
  display:flex;gap:var(--gap-card);overflow-x:auto;
  padding-bottom:4px;scrollbar-width:none;
  margin-bottom:var(--gap-card);
}
.product-scroll::-webkit-scrollbar{display:none}
.p-card{
  flex:none;width:150px;border-radius:var(--radius-card);
  background:var(--bg-elevated);border:1px solid var(--separator);
  box-shadow:var(--shadow-sm);overflow:hidden;cursor:pointer;
  transition:transform .2s var(--spring);
}
.p-card:active{transform:scale(.97)}
.p-card__img{width:100%;aspect-ratio:4/3;position:relative}
.p-card__img--a{background:linear-gradient(150deg,#3E7F8C,#1E5666)}
.p-card__img--b{background:linear-gradient(150deg,#4E8A6E,#2C5B47)}
.p-card__img--c{background:linear-gradient(150deg,#8A7355,#5C4A33)}
.p-card__img--d{background:linear-gradient(150deg,#6A7FA0,#41506B)}
.p-card__cap{padding:9px 11px 11px}
.p-card__name{font-size:14px;font-weight:600;color:var(--text-primary);margin:0}
.p-card__meta{font-size:11px;color:var(--text-secondary);margin:2px 0 0}

/* ---------- 快速入口 4 列 ---------- */
.quick-grid{
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:var(--gap-card);margin-bottom:var(--gap-card);
}
.quick{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  border:none;background:none;cursor:pointer;font-family:inherit;padding:0;
}
.quick__ico{
  width:100%;aspect-ratio:1;border-radius:var(--radius-sm);
  background:var(--bg-elevated);border:1px solid var(--separator);
  display:flex;align-items:center;justify-content:center;color:var(--accent-primary);
  box-shadow:var(--shadow-sm);
}
.quick__ico svg{width:20px;height:20px}
.quick__lb{font-size:11px;color:var(--text-secondary);line-height:1.2;text-align:center}

/* ---------- 表单行 ---------- */
.field{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  min-height:50px;padding:6px 0;
}
.field + .field{border-top:1px solid var(--separator)}
.field__lb{font-size:15px;color:var(--text-primary);flex:none}
.field__vl{font-size:15px;color:var(--text-secondary);text-align:right;display:flex;align-items:center;gap:5px}
.field__vl svg{width:15px;height:15px;color:var(--text-tertiary)}

/* ---------- diff 卡片 ---------- */
.diff{border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--separator)}
.diff__row{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:11px 14px;background:var(--bg-elevated);
  font-size:14px;color:var(--text-primary);
}
.diff__row + .diff__row{border-top:1px solid var(--separator)}
.diff__row--muted{background:var(--bg-secondary);color:var(--text-secondary)}

/* ---------- 搜索框 ---------- */
.search{
  display:flex;align-items:center;gap:8px;
  height:38px;padding:0 12px;border-radius:11px;
  background:var(--bg-fill);color:var(--text-secondary);
  font-size:16px;
}
.search svg{width:16px;height:16px;flex:none;color:var(--text-tertiary)}

/* ---------- 横向筛选条 ---------- */
.filter-scroll{
  display:flex;gap:8px;overflow-x:auto;
  padding-bottom:4px;scrollbar-width:none;
  margin-bottom:var(--gap-card);
}
.filter-scroll::-webkit-scrollbar{display:none}

/* ---------- 列表卡：图左文右 ---------- */
.list-card{
  display:flex;gap:12px;align-items:stretch;
  border-radius:var(--radius-card);padding:10px;
  background:var(--bg-elevated);border:1px solid var(--separator);
  box-shadow:var(--shadow-sm);margin-bottom:var(--gap-card);
  width:100%;text-align:left;font:inherit;color:inherit;border-width:1px;
  cursor:pointer;
  transition:transform .2s var(--spring),box-shadow .2s;
}
.list-card:hover{transform:translateY(-1px);box-shadow:var(--shadow-md)}
.list-card:active{transform:scale(.985)}
.list-card__img{
  width:92px;flex:none;border-radius:14px;overflow:hidden;position:relative;
}
.list-card__img > i{
  position:absolute;left:6px;top:6px;
  font-style:normal;font-size:10px;font-weight:600;letter-spacing:.07px;
  color:#fff;background:rgba(12,31,41,.62);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  padding:2px 7px;border-radius:999px;
}
.list-card__body{flex:1;min-width:0;display:flex;flex-direction:column;padding:2px 2px 2px 0}
.list-card__name{font-size:17px;font-weight:600;letter-spacing:-.43px;margin:0 0 2px;color:var(--text-primary)}
.list-card__desc{
  font-size:13px;line-height:1.4;color:var(--text-secondary);margin:0 0 8px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.list-card__foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto}
.list-card__price{font-size:15px;font-weight:700;letter-spacing:-.23px;color:var(--text-primary)}
.list-card__dist{font-size:12px;color:var(--text-tertiary);font-variant-numeric:tabular-nums}

/* ---------- 攻略卡 ---------- */
.guide-card{
  border-radius:var(--radius-card);padding:var(--padding-card);
  background:var(--bg-elevated);border:1px solid var(--separator);
  box-shadow:var(--shadow-sm);margin-bottom:var(--gap-card);
}
.guide-card__src{
  display:flex;align-items:center;gap:6px;margin-bottom:9px;
  font-size:11px;color:var(--text-tertiary);
}
.guide-card__src b{font-weight:600;color:var(--text-secondary)}
.guide-card__title{
  font-size:17px;font-weight:600;letter-spacing:-.43px;line-height:1.35;
  margin:0 0 6px;color:var(--text-primary);
}
.guide-card__sum{
  font-size:14px;line-height:1.5;color:var(--text-secondary);margin:0 0 11px;
}
.extract{
  border-radius:var(--radius-sm);padding:11px 13px;
  background:var(--bg-secondary);margin-bottom:11px;
}
.extract__lb{
  font-size:11px;font-weight:600;letter-spacing:.4px;
  color:var(--text-tertiary);margin:0 0 7px;
}
.extract__row{display:flex;gap:8px;font-size:13px;line-height:1.45;color:var(--text-primary)}
.extract__row + .extract__row{margin-top:5px}
.extract__row span{flex:none;color:var(--accent-primary);font-weight:600}
.guide-card__foot{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding-top:11px;border-top:1px solid var(--separator);
}
.link-btn{
  display:inline-flex;align-items:center;gap:4px;
  border:none;background:transparent;cursor:pointer;padding:0;
  font-family:inherit;font-size:14px;font-weight:500;color:var(--accent-primary);
}
.link-btn svg{width:14px;height:14px}
.tier{
  display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:5px;
  font-size:10px;font-weight:600;letter-spacing:.07px;
  background:var(--bg-fill-strong);color:var(--accent-primary);
}

/* ---------- 我的：资料头 ---------- */
.profile{
  display:flex;align-items:center;gap:14px;
  padding:var(--padding-card);margin-bottom:var(--gap-card);
  border-radius:var(--radius-lg);
  background:linear-gradient(150deg,var(--accent-primary),var(--hero-from));
  color:var(--hero-title);
}
.profile__av{
  width:56px;height:56px;flex:none;border-radius:50%;
  background:rgba(255,255,255,.18);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:center;color:#fff;
}
.profile__av svg{width:28px;height:28px}
.profile__name{font-size:19px;font-weight:700;letter-spacing:-.23px;margin:0 0 2px}
.profile__sub{font-size:13px;margin:0;color:var(--hero-sub)}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--gap-card);margin-bottom:var(--gap-card)}
.stat{
  text-align:center;padding:13px 8px;border-radius:var(--radius-sm);
  background:var(--bg-elevated);border:1px solid var(--separator);
}
.stat__n{font-size:20px;font-weight:700;letter-spacing:-.43px;color:var(--text-primary);font-variant-numeric:tabular-nums}
.stat__l{font-size:11px;color:var(--text-secondary);margin:1px 0 0}

/* ---------- 可点击反馈 ---------- */
[role="button"],[data-act]{cursor:pointer}
.press{transition:transform .16s var(--spring)}
.press:active{transform:scale(.97)}

/* ---------- 开关 ---------- */
.switch{
  position:relative;width:51px;height:31px;flex:none;
  border:none;border-radius:999px;cursor:pointer;padding:0;
  background:var(--bg-fill-strong);
  transition:background .28s var(--spring);
}
.switch::after{
  content:'';position:absolute;top:2px;left:2px;
  width:27px;height:27px;border-radius:50%;background:#fff;
  box-shadow:0 2px 5px rgba(0,0,0,.2);
  transition:transform .28s var(--spring);
}
.switch[aria-checked="true"]{background:var(--accent-primary)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}

/* ---------- 步进器 ---------- */
.stepper{display:flex;align-items:center;gap:14px}
.stepper__btn{
  width:32px;height:32px;flex:none;border-radius:50%;
  border:1px solid var(--separator);background:var(--bg-elevated);
  color:var(--accent-primary);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:transform .16s var(--spring),opacity .2s;
}
.stepper__btn:active{transform:scale(.88)}
.stepper__btn[disabled]{opacity:.3;cursor:default}
.stepper__btn svg{width:15px;height:15px}
.stepper__v{
  min-width:66px;text-align:center;
  font-size:17px;font-weight:600;letter-spacing:-.23px;
  color:var(--text-primary);font-variant-numeric:tabular-nums;
}

/* ---------- 底部 Sheet ---------- */
.sheet-mask{
  position:absolute;inset:0;z-index:50;
  background:rgba(0,0,0,.35);
  opacity:0;pointer-events:none;transition:opacity .3s;
}
.sheet-mask.is-open{opacity:1;pointer-events:auto}
.sheet{
  position:absolute;left:0;right:0;bottom:0;z-index:60;
  background:var(--bg-elevated);
  border-radius:var(--radius-lg) var(--radius-lg) 0 0;
  padding:10px 0 34px;
  transform:translateY(100%);
  transition:transform .38s var(--spring);
  max-height:76%;overflow-y:auto;scrollbar-width:none;
  box-shadow:0 -8px 30px rgba(0,0,0,.2);
}
.sheet::-webkit-scrollbar{display:none}
.sheet.is-open{transform:translateY(0)}
.sheet__grab{
  width:36px;height:5px;border-radius:3px;background:var(--separator-strong);
  margin:0 auto 14px;
}
.sheet__title{
  font-size:17px;font-weight:600;letter-spacing:-.43px;
  text-align:center;margin:0 0 4px;color:var(--text-primary);
}
.sheet__sub{font-size:13px;text-align:center;color:var(--text-secondary);margin:0 0 6px}
.sheet__list{padding:0 var(--margin-page)}

/* ---------- Toast ---------- */
.toast{
  position:absolute;left:50%;bottom:calc(var(--tabbar-h) + 46px);
  z-index:70;transform:translate(-50%,14px);
  padding:10px 18px;border-radius:999px;
  background:rgba(28,28,30,.9);color:#fff;
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  font-size:14px;font-weight:500;white-space:nowrap;
  opacity:0;pointer-events:none;
  transition:opacity .26s,transform .26s var(--spring);
}
html[data-theme="dark"] .toast{background:rgba(240,240,245,.92);color:#0C1F29}
.toast.is-show{opacity:1;transform:translate(-50%,0)}

/* ---------- 景区详情 Hero ---------- */
.spot-hero{
  position:relative;width:100%;aspect-ratio:4/3;
  border-radius:0;overflow:hidden;margin:0 0 var(--gap-card);
}
.spot-hero--a{background:linear-gradient(155deg,#3E7F8C,#164C5C)}
.spot-hero--b{background:linear-gradient(155deg,#4E8A6E,#26543F)}
.spot-hero--c{background:linear-gradient(155deg,#8A7355,#57452E)}
.spot-hero--d{background:linear-gradient(155deg,#6A7FA0,#3B4A64)}
.spot-hero--e{background:linear-gradient(155deg,#5E8C8C,#2F5252)}
.spot-hero::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(to top,rgba(8,22,28,.72) 0%,rgba(8,22,28,.12) 42%,transparent 62%);
}
.spot-hero__body{
  position:absolute;left:0;right:0;bottom:0;z-index:2;
  padding:0 var(--margin-page) var(--padding-card);
}
.spot-hero__name{
  font-size:28px;line-height:34px;font-weight:700;letter-spacing:.36px;
  color:#fff;margin:0 0 7px;
}
.spot-hero__tags{display:flex;gap:6px;flex-wrap:wrap}
.spot-hero__tags .chip{
  background:rgba(255,255,255,.2);border-color:transparent;
  color:#fff;font-size:12px;min-height:26px;padding:2px 10px;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
}

/* ---------- 浮动回顶按钮 ---------- */
.fab{
  position:absolute;right:16px;bottom:calc(var(--tabbar-h) + 44px);z-index:30;
  width:42px;height:42px;border-radius:50%;
  border:none;cursor:pointer;
  background:var(--bg-elevated);color:var(--accent-primary);
  box-shadow:0 6px 18px rgba(0,0,0,.16);
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transform:translateY(8px);
  transition:opacity .28s,transform .28s var(--spring);
}
.fab.is-show{opacity:1;pointer-events:auto;transform:translateY(0)}
.fab svg{width:19px;height:19px}

/* ---------- 行程列表卡（我的/行程 Tab） ---------- */
.trip-card{
  border-radius:var(--radius-card);overflow:hidden;
  border:1px solid var(--separator);background:var(--bg-elevated);
  box-shadow:var(--shadow-sm);margin-bottom:var(--gap-card);
  width:100%;text-align:left;font:inherit;padding:0;cursor:pointer;
  transition:transform .2s var(--spring),box-shadow .2s;
}
.trip-card:hover{transform:translateY(-1px);box-shadow:var(--shadow-md)}
.trip-card__cover{width:100%;height:86px;position:relative}
.trip-card__cover--a{background:linear-gradient(135deg,#2F6F72,#0F3F48)}
.trip-card__cover--b{background:linear-gradient(135deg,#5B7A5E,#2C4433)}
.trip-card__body{padding:var(--padding-card)}
.trip-card__stops{
  display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:9px;
  font-size:12px;color:var(--text-secondary);
}
.trip-card__stops i{
  width:4px;height:4px;border-radius:50%;background:var(--text-tertiary);font-style:normal;
}

/* ---------- 空状态 ---------- */
.empty{
  display:flex;flex-direction:column;align-items:center;
  padding:44px 24px;text-align:center;
}
.empty__ico{
  width:64px;height:64px;border-radius:20px;margin-bottom:14px;
  background:var(--bg-fill);color:var(--text-tertiary);
  display:flex;align-items:center;justify-content:center;
}
.empty__ico svg{width:30px;height:30px}
.empty__t{font-size:17px;font-weight:600;color:var(--text-primary);margin:0 0 5px}
.empty__d{font-size:14px;line-height:1.5;color:var(--text-secondary);margin:0 0 18px;max-width:30ch}

/* ---------- 骨架屏 ---------- */
.sk{background:var(--bg-fill);border-radius:8px;position:relative;overflow:hidden}
.sk::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.14),transparent);
  animation:shimmer 1.4s infinite;
}
html[data-theme="dark"] .sk::after{background:linear-gradient(90deg,transparent,rgba(255,255,255,.07),transparent)}
@keyframes shimmer{100%{transform:translateX(100%)}}

/* ---------- 加载进度（生成中） ---------- */
.progress{height:6px;border-radius:3px;background:var(--bg-fill);overflow:hidden;margin-top:10px}
.progress__bar{height:100%;width:0;background:var(--accent-primary);border-radius:3px;transition:width .5s ease}

/* ---------- 吸底操作栏 ---------- */
.action-dock{
  position:absolute;left:0;right:0;bottom:calc(var(--tabbar-h) + 34px);z-index:28;
  padding:10px var(--margin-page);
  background:color-mix(in srgb,var(--bg-primary) 82%,transparent);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  backdrop-filter:saturate(180%) blur(20px);
  box-shadow:0 -.5px 0 0 var(--separator);
}
.action-dock .btn{min-height:48px;padding:12px 18px}

/* ---------- 行程时间轴紧凑态（D2） ---------- */
.timeline--compact .tl-item{margin-bottom:var(--gap-card)}

/* ---------- 页面级切换（桌面用，App 外） ---------- */
.stage__nav{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.stage__nav button{
  border:1px solid var(--page-muted);background:transparent;
  color:var(--page-fg);font-family:inherit;font-size:13px;font-weight:500;
  padding:7px 15px;border-radius:999px;cursor:pointer;
  transition:background .2s,color .2s,border-color .2s;
}
.stage__nav button.is-on{background:var(--page-fg);color:var(--page-bg);border-color:var(--page-fg)}
.stage__note{font-size:12px;color:var(--page-muted);text-align:center;margin:0}

@media (max-width:520px){
  .stage{padding:20px 0}
  .stage__meta,.stage__nav,.stage__note{padding:0 16px}
  .phone-mockup{width:100vw;max-width:430px;box-shadow:none}
}
</style>

</div>

/* 重排后按新顺序重算时间轴：顺次累加车程与停留时长（对齐后端 reflow + validate） */
function recomputeTimeline(day){
  const spots = day.items.filter(i=>i.spot);
  const T = s => { const [h,m]=s.split(':').map(Number); return h*60+m; };
  const F = v => String(Math.floor(v/60)).padStart(2,'0')+':'+String(v%60).padStart(2,'0');
  const spotDur = { hgs:150, lg:120, tltb:120, qygz:150, qls:120 };
  let cursor = T('09:00');
  spots.forEach((s,i)=>{
    const travel = i===0 ? 60 : 40;      // 段间车程（演示值）
    cursor += travel;
    const dur = spotDur[s.spot] || 120;
    const start = cursor, end = cursor + dur;
    s.t = `${F(start)} – ${F(end)}`;
    if (s.transit) s.transit.m = `驾车 ${travel} 分钟`;
    cursor = end;
  });
  // 排到 18:00 之后的项剔除（对齐后端 reorder_too_late）
  const dropped = [];
  day.items = day.items.filter(it=>{
    if(!it.spot) return true;
    const start = T(it.t.split(' – ')[0]);
    if (start >= 18*60){ dropped.push(it.n); return false; }
    return true;
  });
  return dropped;
}

/* ==========================================================
   渲染
   ========================================================== */
function render(){
  const c = cur();
  const page = PAGES[c.name] || PAGES.home;
  const canBack = state.stack.length > 1;
  const noTab = !!page.noTab;

  document.getElementById('navBar').innerHTML = `
    ${canBack
      ? `<button class="nav-btn" data-act="back">${I.back}</button>`
      : '<span class="nav-btn--ph"></span>'}
    <span class="nav-bar__title">${page.title}</span>
    ${c.name==='detail'||c.name==='me'
      ? `<button class="nav-btn" data-act="sheet:more">${I.menu}</button>`
      : '<span class="nav-btn--ph"></span>'}`;

  document.getElementById('scroll').innerHTML = page.render();
  const sc = document.getElementById('scroll');
  sc.scrollTop = 0;
  // 沉浸式页面（景区详情 Hero）让 Hero 顶到导航栏下方
  sc.classList.toggle('is-immersive', !!page.immersive);
  sc.classList.toggle('has-dock', !!page.dock);

  const tb = document.getElementById('tabBar');
  tb.style.display = noTab ? 'none' : 'grid';
  tb.innerHTML = TABS.map(t=>`
    <button class="tab-bar__item press ${t.k===page.tab?'is-active':''}" data-tab="${t.root}">
      ${t.ic}<span>${t.lb}</span>
    </button>`).join('');

  document.getElementById('stageNav').innerHTML =
    Object.keys(PAGES).filter(k=>!PAGES[k].noTab).map(k=>
      `<button data-screen="${k}" class="${k===c.name?'is-on':''}">${STAGE_LABELS[k]}</button>`).join('');

  const t = document.getElementById('stageTitle');
  if (t) t.textContent = '游迹 App · ' + STAGE_LABELS[c.name];

  // Sheet
  const mask = document.getElementById('sheetMask');
  const sheet = document.getElementById('sheet');
  if (state.sheet){
    const cfg = state.sheet;
    sheet.innerHTML = `
      <div class="sheet__grab"></div>
      <p class="sheet__title">${cfg.title}</p>
      ${cfg.sub?`<p class="sheet__sub">${cfg.sub}</p>`:''}
      <div class="sheet__list">
        ${cfg.items.map(it=>`
          <button class="field press ${it.plain?'':''}" data-act="${it.a}" style="width:100%;background:none;border:none;text-align:left;font:inherit;padding:13px 0">
            <span class="row" style="gap:11px;width:100%">
              <span style="color:${it.danger?'#FF453A':'var(--accent-primary)'};width:19px;height:19px;flex:none;display:block">${it.ic}</span>
              <span style="flex:1;min-width:0">
                <span style="display:block;font-size:16px;font-weight:500;color:${it.danger?'#FF453A':'var(--text-primary)'}">${it.lb}</span>
                ${it.d?`<span style="display:block;font-size:12.5px;color:var(--text-secondary);margin-top:1px">${it.d}</span>`:''}
              </span>
            </span>
          </button>`).join('')}
      </div>`;
    mask.classList.add('is-open'); sheet.classList.add('is-open');
  } else {
    mask.classList.remove('is-open'); sheet.classList.remove('is-open');
  }

  // 预算条动画
  requestAnimationFrame(()=>{
    document.querySelectorAll('[data-w]').forEach(el=>{ el.style.width = el.dataset.w + '%'; });
  });
  updateFab();
}

/* 滚动回顶按钮 */
function updateFab(){
  const sc = document.getElementById('scroll');
  const fab = document.getElementById('fab');
  if (fab) fab.classList.toggle('is-show', sc.scrollTop > 400);
}

/* ==========================================================
   交互
   ========================================================== */
// 事件挂在整个 stage：覆盖手机内交互 + 手机外的页面切换按钮
document.getElementById('stage').addEventListener('click', (e)=>{
  const tabB = e.target.closest('[data-tab]');
  if (tabB){
    const r = tabB.dataset.tab;
    if (cur().name !== r){ state.stack=[{name:r}]; closeSheet(); }
    render(); return;
  }
  const scr = e.target.closest('[data-screen]');
  if (scr){ state.stack=[{name:scr.dataset.screen}]; closeSheet(); render(); return; }

  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  const [cmd, arg] = act.split(':');

  switch(cmd){
    case 'back':  back(); return;
    case 'close': closeSheet(); render(); return;
    case 'go':    go(arg); return;

    case 'spot':  go('spot',{id:arg}); return;
    case 'guide': go('guideDetail',{id:arg}); return;

    case 'sheet':
      openSheet(arg);
      render(); return;

    case 'fav': {
      const has = state.favs.has(arg);
      has ? state.favs.delete(arg) : state.favs.add(arg);
      render();
      toast(has ? '已取消收藏' : '已加入收藏');
      return;
    }
    case 'add':   toast('已加入行程，AI 会据此重算路线'); return;
    case 'adopt': toast('已纳入规划依据（待核验内容不作为事实）'); return;
    case 'hero':  toast('全屏查看景区实景'); return;
    case 'toast': toast(arg); return;

    case 'day':   state.detail.day=+arg; state.detail.view='list'; render(); return;
    case 'view':  state.detail.view=arg; render(); return;

    case 'people':{
      state.plan.people = Math.min(9,Math.max(1,state.plan.people + (+arg)));
      render(); return;
    }
    case 'budget':{
      state.plan.budget = Math.min(5000,Math.max(500,state.plan.budget + (+arg)));
      render(); return;
    }
    case 'tag':{
      state.plan.interests.has(arg) ? state.plan.interests.delete(arg) : state.plan.interests.add(arg);
      render(); return;
    }
    case 'mode':  state.plan.mode=arg; render(); return;

    case 'efilter': state.explore.filter=arg; render(); return;
    case 'gfilter': state.guide.filter=arg; render(); return;
    case 'eclear':  state.explore.filter='推荐'; state.explore.q=''; render(); return;
    case 'gclear':  state.guide.filter='为你推荐'; render(); return;

    case 'me':
      if (arg==='login'){ state.login=true; render(); toast('登录成功'); return; }
      if (arg==='logout'){ state.login=false; render(); toast('已退出登录'); return; }
      if (arg==='favs'){ go('favs'); return; }
      if (arg==='trips'){ go('trips'); return; }
      if (arg==='done'){ toast('已完成行程回顾属 V0.2'); return; }
      return;

    case 'prefs': toast(arg+' 设置'); return;
    case 'toggle':{
      const sw = el.getAttribute('aria-checked')==='true';
      el.setAttribute('aria-checked', sw?'false':'true');
      toast(sw?'已关闭':'已开启'); return;
    }
    case 'generate': runGenerate(); return;
    case 'order': {
      // 提到景区序列最前；对应后端 reorder_day（锁定前缀），时间轴整体重算
      const day = ITINERARY.days[state.detail.day];
      const spots = day.items.filter(i=>i.spot);
      if (!spots.length){ toast('当天没有可排序的景区'); return; }
      const moved = spots[+arg];
      if (!moved){ toast('该项目不可排序'); return; }
      const rest = spots.filter((_,i)=>i!==+arg);
      const firstSpotPos = day.items.findIndex(i=>i.spot);
      // 保留非景区节点（早餐/餐厅/酒店）原位，仅重排景区之间的相对顺序
      const newSpots = [moved, ...rest];
      const rebuilt = [];
      let si = 0;
      day.items.forEach(it => { rebuilt.push(it.spot ? newSpots[si++] : it); });
      day.items = rebuilt;
      const dropped = recomputeTimeline(day);   // 时间轴整体重算
      state.reordered = true;
      closeSheet(); render();
      toast(dropped.length
        ? `已重排时间；「${dropped.join('、')}」已过时段被移除`
        : `已把「${moved.n}」提到最前，时间已重算`);
      return;
    }
    case 'do':
      closeSheet(); render();
      toast(arg==='swap' ? '已替换并重算当天'
          : arg==='reset' ? '已恢复推荐顺序'
          : arg==='remove' ? '已移除并重算当天' : '已完成');
      return;
    case 'item':   openSheet(SHEETS.item(+arg)); render(); return;
  }
});

/* 生成流程 */
let genTimer = null;
function runGenerate(){
  state.generating = true; state.progress = 0;
  go('generating');
  clearInterval(genTimer);
  genTimer = setInterval(()=>{
    state.progress += 5;
    const bar = document.getElementById('pgBar');
    const txt = document.getElementById('pgText');
    if (bar) bar.style.width = state.progress + '%';
    if (txt) txt.textContent = ['解析需求','召回景区','计算路线','按天装包','预算校验'][Math.min(4,Math.floor(state.progress/20))];
    if (state.progress >= 100){
      clearInterval(genTimer);
      setTimeout(()=>{ state.generating=false; state.stack=[{name:'detail'}]; render(); toast('行程已生成'); },420);
    }
  },190);
}

/* ==========================================================
   双击状态栏切换主题（iOS 原生交互）
   ========================================================== */
(function(){
  const KEY = 'youpji-app-theme';
  const root = document.documentElement;
  const saved = localStorage.getItem(KEY);
  if (saved === 'dark' || saved === 'light') root.setAttribute('data-theme', saved);
  document.getElementById('statusBar').addEventListener('dblclick', ()=>{
    const next = (root.getAttribute('data-theme') || 'light') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    localStorage.setItem(KEY, next);
    document.getElementById('statusBar').animate(
      [{transform:'scale(1)'},{transform:'scale(.975)'},{transform:'scale(1)'}],
      {duration:220, easing:'cubic-bezier(.34,1.56,.64,1)'}
    );
  });
})();

render();
