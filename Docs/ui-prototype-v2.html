<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>游迹 App · UI 原型 V0.1</title>
<style>
/* ============================================================
   Apple Liquid Glass (iOS 26) — 浅色模式 (Ocean Mist 雾海蓝)
   #06425C / #4A90A4 / #A8D5BA / #F4F1DE
   ============================================================ */
html[data-theme="light"]{
  --bg-primary:#FFFFFF;
  --bg-secondary:#F3F7F9;
  --bg-elevated:#FFFFFF;
  --bg-tint:#F4F1DE;
  --bg-fill:rgba(6,66,92,.06);
  --bg-fill-strong:rgba(6,66,92,.12);

  --accent-primary:#06425C;
  --accent-secondary:#4A90A4;
  --accent-tertiary:#A8D5BA;
  --on-accent:#FFFFFF;

  --text-primary:#0C1F29;
  --text-secondary:#526570;
  --text-tertiary:#8A9AA3;
  --text-inverse:#FFFFFF;

  --separator:rgba(6,66,92,.10);
  --separator-strong:rgba(6,66,92,.18);

  --ok:#1E7A4D;      --ok-bg:rgba(46,167,110,.14);
  --warn:#A8630B;    --warn-bg:rgba(255,159,10,.14);
  --dispute:#A03246; --dispute-bg:rgba(255,59,48,.12);
  --none:#7B8790;    --none-bg:rgba(120,120,128,.12);

  --hero-from:#0A506B;
  --hero-to:#06425C;
  --hero-title:#FFFFFF;
  --hero-sub:rgba(255,255,255,.78);

  /* --- Apple Liquid Glass Tokens (Light) --- */
  --glass-bg:rgba(255,255,255,.70);
  --glass-bg-subtle:rgba(255,255,255,.45);
  --glass-bg-elevated:rgba(255,255,255,.88);
  --glass-border:rgba(255,255,255,.75);
  --glass-border-subtle:rgba(255,255,255,.45);
  --glass-specular:inset 0 1px 1px 0 rgba(255,255,255,.95), inset 0 -1px 1px 0 rgba(6,66,92,.04);
  --glass-shadow:0 10px 32px -4px rgba(6,42,60,.09), 0 2px 8px -2px rgba(6,42,60,.04);
  --glass-hover-specular:inset 0 1.5px 1.5px 0 #ffffff, inset 0 -1px 1px 0 rgba(6,66,92,.06);
  --glass-hover-shadow:0 16px 42px -6px rgba(6,42,60,.14), 0 4px 14px -2px rgba(6,42,60,.06);
  --glass-blur:blur(28px) saturate(190%);

  --glass-dock-bg:rgba(255,255,255,.78);
  --glass-dock-border:rgba(255,255,255,.85);
  --glass-dock-specular:inset 0 1.2px 1.5px 0 #ffffff, inset 0 -1px 1px 0 rgba(6,66,92,.05);
  --glass-dock-shadow:0 14px 44px -8px rgba(6,42,60,.18), 0 2px 12px rgba(6,42,60,.06);
  --glass-dock-blur:blur(36px) saturate(210%);

  --glass-prominent-bg:linear-gradient(145deg,rgba(6,66,92,.94),rgba(10,80,107,.98));
  --glass-prominent-border:rgba(255,255,255,.35);
  --glass-prominent-specular:inset 0 1.5px 1px 0 rgba(255,255,255,.55), inset 0 -1.5px 2px 0 rgba(0,0,0,.25);
  --glass-prominent-shadow:0 10px 28px -4px rgba(6,66,92,.35), 0 3px 10px rgba(6,66,92,.20);

  --glass-btn-tinted-bg:rgba(255,255,255,.65);
  --glass-inset-bg:rgba(6,66,92,.06);

  --page-bg:#0F1C23;
  --page-fg:#E6EEF2;
  --page-muted:#8FA6B0;
}

/* ============================================================
   Apple Liquid Glass (iOS 26) — 深色模式 (Ocean Mist 雾海蓝)
   ============================================================ */
html[data-theme="dark"]{
  --bg-primary:#08161C;
  --bg-secondary:#0B1E26;
  --bg-elevated:#112833;
  --bg-tint:#163540;
  --bg-fill:rgba(127,196,217,.10);
  --bg-fill-strong:rgba(127,196,217,.18);

  --accent-primary:#7FC4D9;
  --accent-secondary:#5FA8BC;
  --accent-tertiary:#A8D5BA;
  --on-accent:#06222D;

  --text-primary:#EAF2F5;
  --text-secondary:#9AB0BA;
  --text-tertiary:#667D87;
  --text-inverse:#08161C;

  --separator:rgba(235,235,245,.14);
  --separator-strong:rgba(235,235,245,.24);

  --ok:#4AD98C;      --ok-bg:rgba(74,217,140,.16);
  --warn:#FFB340;    --warn-bg:rgba(255,179,64,.16);
  --dispute:#FF7B85; --dispute-bg:rgba(255,123,133,.16);
  --none:#8A979F;    --none-bg:rgba(138,151,159,.14);

  --hero-from:#0B3A4D;
  --hero-to:#082531;
  --hero-title:#FFFFFF;
  --hero-sub:rgba(255,255,255,.72);

  /* --- Apple Liquid Glass Tokens (Dark) --- */
  --glass-bg:rgba(18,44,56,.56);
  --glass-bg-subtle:rgba(13,33,42,.45);
  --glass-bg-elevated:rgba(24,56,70,.72);
  --glass-border:rgba(127,196,217,.22);
  --glass-border-subtle:rgba(127,196,217,.14);
  --glass-specular:inset 0 1px 1px 0 rgba(255,255,255,.26), inset 0 -1px 1px 0 rgba(0,0,0,.40);
  --glass-shadow:0 12px 38px -6px rgba(0,0,0,.55), 0 2px 10px rgba(0,0,0,.35);
  --glass-hover-specular:inset 0 1.5px 1.5px 0 rgba(255,255,255,.38), inset 0 -1px 1px 0 rgba(0,0,0,.45);
  --glass-hover-shadow:0 18px 46px -8px rgba(0,0,0,.68), 0 4px 14px rgba(0,0,0,.40);
  --glass-blur:blur(28px) saturate(200%);

  --glass-dock-bg:rgba(15,38,48,.72);
  --glass-dock-border:rgba(127,196,217,.30);
  --glass-dock-specular:inset 0 1px 1.5px 0 rgba(255,255,255,.34), inset 0 -1px 1px 0 rgba(0,0,0,.45);
  --glass-dock-shadow:0 16px 44px -8px rgba(0,0,0,.70), 0 2px 12px rgba(0,0,0,.40);
  --glass-dock-blur:blur(40px) saturate(220%);

  --glass-prominent-bg:linear-gradient(145deg,rgba(127,196,217,.94),rgba(74,144,164,.98));
  --glass-prominent-border:rgba(255,255,255,.45);
  --glass-prominent-specular:inset 0 1.5px 1px 0 rgba(255,255,255,.75), inset 0 -1.5px 2px 0 rgba(0,0,0,.25);
  --glass-prominent-shadow:0 10px 30px -4px rgba(127,196,217,.35), 0 3px 12px rgba(127,196,217,.20);

  --glass-btn-tinted-bg:rgba(127,196,217,.15);
  --glass-inset-bg:rgba(127,196,217,.10);

  --page-bg:#091217;
  --page-fg:#E6EEF2;
  --page-muted:#7C929E;
}

*{box-sizing:border-box;-webkit-font-smoothing:antialiased}
.phone-mockup h1,.phone-mockup h2,.phone-mockup h3,.phone-mockup p{margin:0}
html,body{margin:0;padding:0;min-height:100%}
body{
  background:var(--page-bg);
  color:var(--page-fg);
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;
  font-size:17px;line-height:1.47;
  transition:background .35s ease,color .35s ease;
}

:root{
  --margin-page:16px;
  --gap-card:12px;
  --padding-card:16px;
  --radius-card:20px;
  --radius-sm:14px;
  --radius-lg:28px;
  --tabbar-h:49px;
  --navbar-h:44px;
  --spring:cubic-bezier(.34,1.56,.64,1);
}

.page{padding:0 var(--margin-page)}
.section{
  padding:0 var(--margin-page) var(--gap-card);
  display:flex;flex-direction:column;
}
.section__header{
  display:flex;align-items:baseline;justify-content:space-between;
  margin-bottom:var(--gap-card);
}
.section__header h3{
  font-size:17px;font-weight:600;letter-spacing:-.43px;margin:0;
  color:var(--text-primary);
}
.stage .section__header h3{color:var(--page-fg)}

/* ---------- 舞台 ---------- */
.stage{
  min-height:100dvh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:20px;padding:36px 20px 28px;
}
.stage__meta{text-align:center;max-width:430px}
.stage__meta h1{font-size:20px;font-weight:600;letter-spacing:-.43px;margin:0 0 4px}
.stage__meta p{font-size:13px;line-height:1.4;color:var(--page-muted);margin:0}

/* ---------- 手机原型：旗舰曲面微框 + 硬件灵动岛 ---------- */
.phone-mockup{
  width:430px;height:900px;flex:none;
  background:var(--bg-primary);
  color:var(--text-primary);
  border-radius:54px;
  overflow:hidden;
  position:relative;
  display:flex;flex-direction:column;
  box-shadow:0 35px 85px -15px rgba(0,0,0,.52), 0 0 0 1px rgba(255,255,255,.14), inset 0 0 0 1.5px rgba(255,255,255,.18);
  border:8px solid #162028;
  transition:background .35s ease, border-color .35s ease;
}

/* 硬件微孔：灵动岛 Dynamic Island */
.dynamic-island{
  position:absolute;top:11px;left:50%;transform:translateX(-50%);
  width:120px;height:30px;border-radius:999px;
  background:#000000;z-index:45;
  box-shadow:0 0 1px 1px rgba(255,255,255,.10);
  pointer-events:none;
  transition:width .3s var(--spring), height .3s var(--spring);
}

/* 底部 Home Indicator 触控条 */
.home-indicator{
  position:absolute;bottom:8px;left:50%;transform:translateX(-50%);
  width:134px;height:5px;border-radius:999px;
  background:var(--text-primary);opacity:.22;
  z-index:45;pointer-events:none;
  transition:opacity .2s;
}

/* ---------- 动态环境光晕网格 (Liquid Canvas Mesh) ---------- */
.app__ambient{
  position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0;
}
.ambient-orb{
  position:absolute;border-radius:50%;filter:blur(65px);opacity:.30;
  transition:opacity .35s ease;
}
.ambient-orb--1{
  width:260px;height:260px;top:-40px;right:-50px;
  background:radial-gradient(circle, var(--accent-secondary) 0%, transparent 70%);
}
.ambient-orb--2{
  width:280px;height:280px;top:320px;left:-80px;
  background:radial-gradient(circle, var(--accent-tertiary) 0%, transparent 70%);
  opacity:.22;
}
.ambient-orb--3{
  width:240px;height:240px;bottom:80px;right:-40px;
  background:radial-gradient(circle, var(--accent-primary) 0%, transparent 70%);
  opacity:.25;
}
html[data-theme="dark"] .ambient-orb{opacity:.20}

/* ---------- 滚动容器 ---------- */
.app__scroll{
  flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  background:color-mix(in srgb, var(--bg-secondary) 72%, transparent);
  padding-top:calc(44px + var(--navbar-h));
  padding-bottom:calc(var(--tabbar-h) + 54px);
  position:relative;z-index:10;
}
.app__scroll.is-immersive{
  padding-top:0;
  background:color-mix(in srgb, var(--bg-primary) 40%, transparent);
}
.app__scroll.is-immersive .spot-hero{margin-top:0}
/* 有吸底操作栏且无底部标签栏时，尾部让出合适距离 */
.app__scroll.has-dock{padding-bottom:96px}
.app__scroll::-webkit-scrollbar{display:none}

/* ---------- 状态栏（双击切主题） ---------- */
.status-bar{
  height:44px;flex:none;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 22px;
  font-size:14px;font-weight:600;letter-spacing:-.1px;
  color:var(--text-primary);
  background:transparent;
  cursor:pointer;user-select:none;-webkit-user-select:none;
  position:relative;z-index:30;
  transition:color .35s ease;
}
.status-bar__time{font-variant-numeric:tabular-nums;min-width:52px}
.status-bar__right{display:flex;align-items:center;gap:5px}

/* 状态栏双击提示：仅在桌面端悬停状态栏时优雅浮现，绝不阻挡导航标题 */
.status-bar::after{
  content:'双击状态栏切换深浅色';
  position:absolute;top:calc(100% + 4px);left:50%;transform:translateX(-50%);
  padding:4px 10px;background:rgba(12,31,41,.88);color:#fff;
  border:1px solid rgba(255,255,255,.2);
  font-size:11px;font-weight:600;border-radius:999px;white-space:nowrap;
  pointer-events:none;z-index:60;
  box-shadow:0 4px 14px rgba(0,0,0,.25);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  opacity:0;transition:opacity .2s ease;
}
.status-bar:hover::after{opacity:1}

/* ---------- 导航栏 44pt + 毛玻璃 ---------- */
.nav-bar{
  height:var(--navbar-h);flex:none;
  display:flex;align-items:center;gap:8px;padding:0 14px;
  position:absolute;left:0;right:0;top:44px;z-index:25;
  background:var(--glass-bg);
  -webkit-backdrop-filter:var(--glass-blur);
  backdrop-filter:var(--glass-blur);
  border-bottom:1px solid var(--glass-border-subtle);
  box-shadow:var(--glass-specular);
  transition:background .35s ease,color .35s ease;
}
/* 沉浸式页（景区实景）：导航栏半透明 */
.phone-mockup:has(.is-immersive) .nav-bar{
  background:linear-gradient(180deg,rgba(0,0,0,.45) 0%,transparent 100%);
  box-shadow:none;border-bottom-color:transparent;
  -webkit-backdrop-filter:none;backdrop-filter:none;
  color:#fff;
}
.phone-mockup:has(.is-immersive) .nav-bar__title{color:#fff}
.nav-bar__title{
  flex:1;text-align:center;font-size:17px;font-weight:600;letter-spacing:-.43px;
  color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
/* 首页地点天气胶囊 */
.nav-bar__loc{
  display:inline-flex;align-items:center;gap:5px;
  padding:4px 12px;border-radius:999px;
  background:var(--glass-bg-subtle);border:1px solid var(--glass-border-subtle);
  margin:0 auto;font-size:13px;font-weight:600;color:var(--text-primary);
  cursor:pointer;transition:transform .18s var(--spring);
}
.nav-bar__loc:active{transform:scale(.95)}
.nav-bar__loc svg{width:13px;height:13px;color:var(--accent-primary)}

/* 导航按钮：圆润微晶玻璃键，保证在图片与白底下均清晰 */
.nav-btn{
  width:36px;height:36px;flex:none;border-radius:999px;
  display:flex;align-items:center;justify-content:center;
  border:1px solid var(--glass-border);
  background:var(--glass-bg-elevated);cursor:pointer;
  color:var(--text-primary);
  box-shadow:var(--glass-specular), 0 2px 8px rgba(0,0,0,.08);
  -webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);
  transition:transform .18s var(--spring),opacity .18s,background .2s;
}
.phone-mockup:has(.is-immersive) .nav-btn{
  background:rgba(0,0,0,.42);
  border-color:rgba(255,255,255,.32);
  color:#fff;
  box-shadow:0 2px 10px rgba(0,0,0,.25);
}
.nav-btn:active{transform:scale(.90)}
.nav-btn svg{width:18px;height:18px;display:block}
.nav-btn--ph{width:36px;flex:none}

/* ---------- 悬浮液态玻璃标签栏 (Floating Glass Capsule) ---------- */
.tab-bar{
  position:absolute;
  left:20px;right:20px;bottom:22px;z-index:35;
  height:62px;
  padding:4px 6px;
  border-radius:999px;
  display:grid;grid-template-columns:repeat(5,1fr);
  background:var(--glass-dock-bg);
  -webkit-backdrop-filter:var(--glass-dock-blur);
  backdrop-filter:var(--glass-dock-blur);
  border:1px solid var(--glass-dock-border);
  box-shadow:var(--glass-dock-specular), var(--glass-dock-shadow);
  transition:background .35s ease,border-color .35s ease,transform .3s var(--spring),opacity .25s;
}
.tab-bar__item{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  border:none;background:transparent;cursor:pointer;
  color:var(--text-secondary);font-size:10.5px;font-weight:500;letter-spacing:.08px;
  padding:3px 0;border-radius:999px;
  transition:color .2s,transform .18s var(--spring),background .25s ease;
}
.tab-bar__item:active{transform:scale(.90)}
.tab-bar__item.is-active{
  color:var(--accent-primary);
  background:rgba(6,66,92,.08);
  font-weight:700;
}
html[data-theme="dark"] .tab-bar__item.is-active{
  background:rgba(127,196,217,.16);
}
.tab-bar__item svg{width:21px;height:21px}

/* ---------- Hero：full-bleed 贴边，0 圆角 ---------- */
.hero{
  margin:0 0 var(--gap-card);
  width:100%;
  aspect-ratio:16/9.5;
  max-height:290px;
  border-radius:0;
  position:relative;overflow:hidden;
  background:linear-gradient(165deg,var(--hero-from),var(--hero-to));
  display:flex;flex-direction:column;justify-content:flex-end;
  padding:20px var(--margin-page) 18px;
  cursor:pointer;
}
.hero::before{
  content:'';position:absolute;top:-30px;right:-30px;
  width:0;height:0;
  border-left:110px solid transparent;
  border-right:110px solid transparent;
  border-bottom:190px solid rgba(255,255,255,.05);
  pointer-events:none;
}
.hero::after{
  content:'';position:absolute;bottom:0;right:20px;
  width:0;height:0;
  border-left:80px solid transparent;
  border-right:80px solid transparent;
  border-bottom:130px solid rgba(255,255,255,.07);
  pointer-events:none;
}
.hero__body{position:relative;z-index:2;color:var(--hero-title)}
.hero__eyebrow{
  font-size:12px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;
  color:var(--hero-sub);margin:0 0 4px;
}
.hero__title{
  font-size:28px;font-weight:700;letter-spacing:.36px;line-height:1.2;
  margin:0 0 6px;color:var(--hero-title);
}
.hero__meta{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--hero-sub);margin:0}
.hero__meta svg{width:14px;height:14px;flex:none}

/* ---------- 卡片：Apple Liquid Glass 材质 ---------- */
.card{
  border-radius:var(--radius-card);
  padding:var(--padding-card);
  background:var(--glass-bg);
  -webkit-backdrop-filter:var(--glass-blur);
  backdrop-filter:var(--glass-blur);
  border:1px solid var(--glass-border);
  box-shadow:var(--glass-specular), var(--glass-shadow);
  margin-bottom:var(--gap-card);
  transition:transform .2s var(--spring),box-shadow .25s ease,background .25s ease;
  position:relative;
}
.card--tap{cursor:pointer;display:block;width:100%;text-align:left;font:inherit;color:inherit}
.card--tap:hover{
  transform:translateY(-2px);
  background:var(--glass-bg-elevated);
  box-shadow:var(--glass-hover-specular), var(--glass-hover-shadow);
}
.card--tap:active{transform:scale(.982)}
.card--feature{
  background:linear-gradient(150deg,var(--accent-primary),var(--hero-from));
  border:1px solid rgba(255,255,255,.28);
  box-shadow:inset 0 1.5px 1px 0 rgba(255,255,255,.45), 0 12px 36px -4px rgba(6,66,92,.35);
  color:var(--hero-title);
}
.card--tint{
  background:color-mix(in srgb, var(--bg-tint) 65%, transparent);
  border-color:var(--glass-border);
  -webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);
}

.row{display:flex;align-items:center;gap:8px}
.row--between{justify-content:space-between}
.row--wrap{flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:2px}
.muted{color:var(--text-secondary)}
.faint{color:var(--text-tertiary)}

/* ---------- 按钮：Apple Liquid Glass 材质 ---------- */
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;min-height:48px;padding:12px 20px;
  border:1px solid var(--glass-prominent-border);border-radius:18px;cursor:pointer;
  font-family:inherit;font-size:16px;font-weight:600;letter-spacing:-.35px;
  background:var(--glass-prominent-bg);color:var(--on-accent);
  box-shadow:var(--glass-prominent-specular), var(--glass-prominent-shadow);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  position:relative;overflow:hidden;
  transition:transform .18s var(--spring),opacity .18s,box-shadow .2s;
}
.btn::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(255,255,255,.24) 0%,transparent 55%);
  pointer-events:none;border-radius:inherit;
}
.btn:hover{box-shadow:var(--glass-prominent-specular), 0 14px 34px -4px rgba(6,66,92,.45)}
.btn:active{transform:scale(.972);opacity:.92}

.btn--tinted{
  background:var(--glass-btn-tinted-bg);color:var(--accent-primary);
  border:1px solid var(--glass-border);
  box-shadow:var(--glass-specular), 0 4px 14px rgba(0,0,0,.04);
  -webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);
}
.btn--tinted::before{display:none}
.btn--tinted:hover{background:var(--glass-bg-elevated);box-shadow:var(--glass-hover-specular), 0 6px 18px rgba(0,0,0,.06)}

.btn--sm{min-height:36px;padding:7px 15px;font-size:13.5px;border-radius:12px;width:auto}
.btn svg{width:18px;height:18px}

/* ---------- Chips / 分段控件：液态玻璃胶囊 ---------- */
.seg{
  display:flex;padding:3px;border-radius:14px;
  background:var(--glass-inset-bg);
  border:1px solid var(--glass-border-subtle);
  box-shadow:inset 0 1px 3px rgba(0,0,0,.06);
  position:relative;
}
.seg__btn{
  flex:1;min-height:34px;border:none;background:transparent;cursor:pointer;
  font-family:inherit;font-size:13px;font-weight:600;letter-spacing:-.08px;
  color:var(--text-secondary);border-radius:11px;
  transition:background .22s,color .22s,box-shadow .22s,transform .16s var(--spring);
}
.seg__btn.is-active{
  background:var(--glass-bg-elevated);color:var(--accent-primary);
  box-shadow:var(--glass-specular), 0 3px 10px rgba(0,0,0,.07);
}
.chip{
  display:inline-flex;align-items:center;gap:5px;
  min-height:34px;padding:6px 14px;border-radius:999px;
  background:var(--glass-bg);
  -webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);
  border:1px solid var(--glass-border);
  box-shadow:var(--glass-specular);
  font-size:13.5px;font-weight:500;color:var(--text-primary);cursor:pointer;
  font-family:inherit;
  transition:transform .16s var(--spring),background .2s,border-color .2s,box-shadow .2s;
}
.chip:hover{background:var(--glass-bg-elevated);transform:translateY(-1px)}
.chip:active{transform:scale(.94)}
.chip.is-on{
  background:var(--glass-prominent-bg);color:var(--on-accent);
  border-color:var(--glass-prominent-border);
  box-shadow:var(--glass-prominent-specular), 0 4px 14px rgba(6,66,92,.28);
}

/* ---------- 核验徽章：微晶体胶囊 ---------- */
.verified{
  display:inline-flex;align-items:center;gap:5px;flex:none;
  height:24px;padding:0 9px;border-radius:999px;
  font-size:11px;font-weight:600;letter-spacing:-.08px;
  border:1px solid rgba(255,255,255,.35);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  box-shadow:inset 0 1px 1px 0 rgba(255,255,255,.6), 0 2px 6px rgba(0,0,0,.04);
}
html[data-theme="dark"] .verified{
  border-color:rgba(255,255,255,.12);
  box-shadow:inset 0 1px 1px 0 rgba(255,255,255,.2), 0 2px 6px rgba(0,0,0,.2);
}
.verified__dot{width:6px;height:6px;border-radius:50%;flex:none;box-shadow:0 0 6px currentColor}
.verified--ok{background:var(--ok-bg);color:var(--ok)}
.verified--warn{background:var(--warn-bg);color:var(--warn)}
.verified--dispute{background:var(--dispute-bg);color:var(--dispute)}
.verified--none{background:var(--none-bg);color:var(--none)}

/* ---------- 快速入口 4 列 ---------- */
.quick-grid{
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:var(--gap-card);margin-bottom:var(--gap-card);
}
.quick{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  border:none;background:none;cursor:pointer;font-family:inherit;padding:0;
}
.quick__ico{
  width:100%;aspect-ratio:1;border-radius:18px;
  background:var(--glass-bg);
  -webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);
  border:1px solid var(--glass-border);
  display:flex;align-items:center;justify-content:center;color:var(--accent-primary);
  box-shadow:var(--glass-specular), 0 4px 14px rgba(6,42,60,.06);
  transition:transform .18s var(--spring),background .2s,box-shadow .2s;
}
.quick:hover .quick__ico{
  background:var(--glass-bg-elevated);
  transform:translateY(-2px);
  box-shadow:var(--glass-hover-specular), 0 8px 20px rgba(6,42,60,.10);
}
.quick:active .quick__ico{transform:scale(.92)}
.quick__ico svg{width:20px;height:20px}
.quick__lb{font-size:11px;color:var(--text-secondary);line-height:1.2;text-align:center}

/* ---------- 表单行 ---------- */
.field{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  min-height:48px;padding:10px 0;
  border-bottom:1px solid var(--separator);
}
.field:last-child{border-bottom:none}
.field__lb{font-size:16px;color:var(--text-primary)}
.field__vl{
  font-size:16px;color:var(--text-secondary);
  display:flex;align-items:center;gap:6px;
}
.field__vl svg{width:16px;height:16px;color:var(--text-tertiary)}

/* ---------- 实时交互搜索框 ---------- */
.search-box{
  display:flex;align-items:center;gap:10px;
  height:42px;padding:0 14px;border-radius:14px;
  background:var(--glass-bg-elevated);
  border:1px solid var(--glass-border);
  box-shadow:var(--glass-specular), var(--glass-shadow);
  margin-bottom:var(--gap-card);
  -webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);
}
.search-box__ico{width:16px;height:16px;color:var(--text-tertiary);flex:none;display:flex;align-items:center}
.search-box__ico svg{width:100%;height:100%}
.search-box__input{
  flex:1;min-width:0;border:none;background:transparent;
  font:inherit;font-size:14.5px;color:var(--text-primary);outline:none;
}
.search-box__input::placeholder{color:var(--text-tertiary)}
.search-box__clear{
  width:22px;height:22px;border-radius:999px;background:var(--bg-fill);
  border:none;color:var(--text-tertiary);cursor:pointer;
  display:flex;align-items:center;justify-content:center;padding:0;
  transition:transform .15s var(--spring);
}
.search-box__clear:active{transform:scale(.88)}
.search-box__clear svg{width:13px;height:13px}

/* ---------- 横向满宽平滑滚动 (Full-bleed) ---------- */
.filter-scroll{
  display:flex;gap:8px;overflow-x:auto;
  margin:0 calc(-1 * var(--margin-page)) var(--gap-card);
  padding:2px var(--margin-page) 6px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.filter-scroll::-webkit-scrollbar{display:none}

.product-scroll{
  display:flex;gap:12px;overflow-x:auto;
  margin:0 calc(-1 * var(--margin-page)) var(--gap-card);
  padding:4px var(--margin-page) 10px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.product-scroll::-webkit-scrollbar{display:none}

/* ---------- 列表卡：图左文右 ---------- */
.list-card{
  display:flex;gap:12px;align-items:stretch;
  border-radius:var(--radius-card);padding:10px;
  background:var(--glass-bg);
  -webkit-backdrop-filter:var(--glass-blur);
  backdrop-filter:var(--glass-blur);
  border:1px solid var(--glass-border);
  box-shadow:var(--glass-specular), var(--glass-shadow);
  margin-bottom:var(--gap-card);
  width:100%;text-align:left;font:inherit;color:inherit;
  cursor:pointer;
  transition:transform .2s var(--spring),box-shadow .25s ease,background .25s ease;
}
.list-card:hover{
  transform:translateY(-2px);
  background:var(--glass-bg-elevated);
  box-shadow:var(--glass-hover-specular), var(--glass-hover-shadow);
}
.list-card:active{transform:scale(.982)}
.list-card__img{
  width:92px;flex:none;border-radius:14px;overflow:hidden;position:relative;
}
.list-card__img > i{
  position:absolute;left:6px;top:6px;
  font-style:normal;font-size:10px;font-weight:600;letter-spacing:.07px;
  color:#fff;background:rgba(12,31,41,.62);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  padding:2px 7px;border-radius:999px;
}
.list-card__body{flex:1;min-width:0;display:flex;flex-direction:column;padding:2px 2px 2px 0}
.list-card__name{font-size:16.5px;font-weight:600;letter-spacing:-.43px;margin:0 0 2px;color:var(--text-primary)}
.list-card__desc{
  font-size:13px;line-height:1.4;color:var(--text-secondary);margin:0 0 8px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.list-card__foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto}
.list-card__price{font-size:15px;font-weight:700;letter-spacing:-.23px;color:var(--text-primary)}
.list-card__dist{font-size:12px;color:var(--text-tertiary);font-variant-numeric:tabular-nums}

/* ---------- 攻略卡 ---------- */
.guide-card{
  border-radius:var(--radius-card);padding:var(--padding-card);
  background:var(--glass-bg);
  -webkit-backdrop-filter:var(--glass-blur);
  backdrop-filter:var(--glass-blur);
  border:1px solid var(--glass-border);
  box-shadow:var(--glass-specular), var(--glass-shadow);
  margin-bottom:var(--gap-card);
  transition:transform .2s var(--spring),box-shadow .25s ease,background .25s ease;
}
.guide-card.press:hover{
  transform:translateY(-2px);
  background:var(--glass-bg-elevated);
  box-shadow:var(--glass-hover-specular), var(--glass-hover-shadow);
}
.guide-card__src{
  display:flex;align-items:center;gap:6px;margin-bottom:9px;
  font-size:11px;color:var(--text-tertiary);
}
.guide-card__src b{font-weight:600;color:var(--text-secondary)}
.guide-card__title{
  font-size:16.5px;font-weight:600;letter-spacing:-.43px;line-height:1.35;
  margin:0 0 6px;color:var(--text-primary);
}
.guide-card__sum{
  font-size:13.5px;line-height:1.5;color:var(--text-secondary);margin:0 0 11px;
}
.extract{
  border-radius:var(--radius-sm);padding:11px 13px;
  background:var(--glass-inset-bg);
  border:1px solid var(--glass-border-subtle);
  margin-bottom:11px;
}
.extract__row{display:flex;gap:8px;font-size:13px;line-height:1.45;color:var(--text-primary)}
.extract__row + .extract__row{margin-top:5px}
.extract__row span{flex:none;color:var(--accent-primary);font-weight:600}
.guide-card__foot{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding-top:11px;border-top:1px solid var(--separator);
}
.link-btn{
  display:inline-flex;align-items:center;gap:4px;
  border:none;background:transparent;cursor:pointer;padding:0;
  font-family:inherit;font-size:14px;font-weight:500;color:var(--accent-primary);
}
.link-btn svg{width:14px;height:14px}
.tier{
  display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:5px;
  font-size:10px;font-weight:600;letter-spacing:.07px;
  background:var(--bg-fill-strong);color:var(--accent-primary);
}

/* ---------- 行程列表卡 ---------- */
.trip-card{
  border-radius:var(--radius-card);overflow:hidden;
  border:1px solid var(--glass-border);
  background:var(--glass-bg);
  -webkit-backdrop-filter:var(--glass-blur);
  backdrop-filter:var(--glass-blur);
  box-shadow:var(--glass-specular), var(--glass-shadow);
  margin-bottom:var(--gap-card);
  width:100%;text-align:left;font:inherit;padding:0;cursor:pointer;
  transition:transform .2s var(--spring),box-shadow .25s ease,background .25s ease;
}
.trip-card:hover{
  transform:translateY(-2px);
  background:var(--glass-bg-elevated);
  box-shadow:var(--glass-hover-specular), var(--glass-hover-shadow);
}
.trip-card__cover{width:100%;height:86px;position:relative}
.trip-card__body{padding:var(--padding-card)}
.trip-card__stops{
  display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:9px;
  font-size:12px;color:var(--text-secondary);
}
.trip-card__stops i{
  width:4px;height:4px;border-radius:50%;background:var(--text-tertiary);font-style:normal;
}

/* ---------- 我的：资料头与统计 ---------- */
.profile{
  display:flex;align-items:center;gap:14px;
  padding:14px var(--padding-card);
  background:var(--glass-bg);
  border:1px solid var(--glass-border);
  border-radius:var(--radius-card);
  box-shadow:var(--glass-specular), var(--glass-shadow);
  -webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);
  margin-bottom:var(--gap-card);cursor:pointer;
  transition:transform .2s var(--spring);
}
.profile:hover{transform:translateY(-1px);background:var(--glass-bg-elevated)}
.profile__av{
  width:52px;height:52px;border-radius:999px;
  background:linear-gradient(145deg,var(--accent-primary),var(--accent-secondary));
  color:#fff;display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 14px rgba(6,66,92,.25);flex:none;
}
.profile__av svg{width:26px;height:26px}
.profile__name{font-size:18px;font-weight:700;letter-spacing:-.43px;color:var(--text-primary);margin:0 0 2px}
.profile__sub{font-size:12.5px;color:var(--text-secondary);margin:0}

.stat-row{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:10px;margin-bottom:var(--gap-card);
}
.stat{
  padding:12px 8px;text-align:center;
  background:var(--glass-bg);
  border:1px solid var(--glass-border);
  border-radius:var(--radius-sm);
  box-shadow:var(--glass-specular), var(--glass-shadow);
  -webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);
  cursor:pointer;transition:transform .18s var(--spring);
}
.stat:hover{transform:translateY(-1px);background:var(--glass-bg-elevated)}
.stat__n{font-size:20px;font-weight:700;color:var(--accent-primary);font-variant-numeric:tabular-nums}
.stat__l{font-size:11.5px;color:var(--text-secondary);margin:2px 0 0;font-weight:500}

/* ---------- 浮动回顶按钮 ---------- */
.fab{
  position:absolute;right:22px;bottom:94px;z-index:32;
  width:44px;height:44px;border-radius:50%;
  border:1px solid var(--glass-border);
  cursor:pointer;
  background:var(--glass-bg-elevated);color:var(--accent-primary);
  -webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);
  box-shadow:var(--glass-specular), 0 8px 24px rgba(0,0,0,.15);
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transform:translateY(8px);
  transition:opacity .28s,transform .28s var(--spring),background .2s;
}
.fab.is-show{opacity:1;pointer-events:auto;transform:translateY(0)}
.fab:hover{transform:translateY(-1px);box-shadow:var(--glass-hover-specular), 0 12px 28px rgba(0,0,0,.2)}
.fab:active{transform:scale(.92)}
.fab svg{width:19px;height:19px}

/* ---------- 吸底操作栏：悬浮液态玻璃岛 ---------- */
.action-dock{
  position:absolute;left:20px;right:20px;bottom:22px;z-index:36;
  padding:10px 14px;
  border-radius:26px;
  background:var(--glass-dock-bg);
  -webkit-backdrop-filter:var(--glass-dock-blur);
  backdrop-filter:var(--glass-dock-blur);
  border:1px solid var(--glass-dock-border);
  box-shadow:var(--glass-dock-specular), var(--glass-dock-shadow);
  transition:transform .3s var(--spring),opacity .25s;
}
.action-dock .btn{min-height:46px;padding:10px 18px}

/* ---------- 时间轴与过路段 ---------- */
.timeline{margin:0 0 var(--gap-card)}
.tl-item{
  display:flex;gap:12px;position:relative;
  padding-bottom:14px;
}
.tl-item::before{
  content:'';position:absolute;left:13px;top:28px;bottom:0;
  width:2px;background:var(--separator);
}
.tl-item:last-child::before{display:none}
.tl-item__dot{
  width:28px;height:28px;border-radius:50%;flex:none;
  background:var(--glass-bg-elevated);border:1px solid var(--glass-border);
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;color:var(--accent-primary);
  box-shadow:var(--glass-specular), 0 2px 6px rgba(0,0,0,.06);
  z-index:2;
}
.tl-item__cnt{flex:1;min-width:0}
.transit{
  margin:4px 0 12px 38px;padding:6px 12px;border-radius:999px;
  display:inline-flex;align-items:center;gap:6px;
  background:var(--glass-inset-bg);border:1px solid var(--glass-border-subtle);
  font-size:12px;color:var(--text-secondary);
}
.transit svg{width:14px;height:14px;color:var(--accent-primary)}

/* ---------- 预算条与对比块 ---------- */
.budget{margin-top:10px}
.budget__nums{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.budget__val{font-size:22px;font-weight:700;color:var(--text-primary);letter-spacing:-.43px}
.budget__cap{font-size:12px;color:var(--text-secondary)}
.budget__track{
  height:7px;border-radius:999px;background:var(--glass-inset-bg);
  overflow:hidden;position:relative;border:1px solid var(--glass-border-subtle);
}
.budget__fill{
  height:100%;background:linear-gradient(90deg,var(--accent-secondary),var(--accent-primary));
  border-radius:999px;transition:width .4s ease;
}
.diff{
  border-radius:var(--radius-sm);overflow:hidden;
  border:1px solid var(--glass-border);background:var(--glass-bg);
}
.diff__row{
  display:flex;justify-content:space-between;align-items:center;
  padding:10px 14px;border-bottom:1px solid var(--separator);
  font-size:14px;color:var(--text-primary);
}
.diff__row:last-child{border-bottom:none}
.diff__row--muted{opacity:.6}

/* ---------- 提示气泡 ---------- */
.alert{
  display:flex;align-items:flex-start;gap:10px;
  padding:12px 14px;border-radius:var(--radius-sm);
  background:rgba(255,159,10,.12);border:1px solid rgba(255,159,10,.25);
  color:var(--warn);font-size:13px;line-height:1.45;margin-bottom:var(--gap-card);
}
.alert svg{width:18px;height:18px;flex:none;margin-top:1px}

/* ---------- 开关 & 步进器 ---------- */
.switch{
  position:relative;width:52px;height:32px;flex:none;
  border:1px solid var(--glass-border-subtle);border-radius:999px;cursor:pointer;padding:0;
  background:var(--glass-inset-bg);
  box-shadow:inset 0 1px 3px rgba(0,0,0,.1);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  transition:background .28s var(--spring),border-color .28s;
}
.switch::after{
  content:'';position:absolute;top:2px;left:2px;
  width:26px;height:26px;border-radius:50%;background:#fff;
  box-shadow:0 3px 8px rgba(0,0,0,.25), inset 0 1px 1px rgba(255,255,255,.9);
  transition:transform .28s var(--spring);
}
.switch[aria-checked="true"]{
  background:var(--glass-prominent-bg);
  border-color:var(--glass-prominent-border);
  box-shadow:var(--glass-prominent-specular), 0 2px 10px rgba(6,66,92,.25);
}
.switch[aria-checked="true"]::after{transform:translateX(20px)}

.stepper{display:flex;align-items:center;gap:14px}
.stepper__btn{
  width:32px;height:32px;flex:none;border-radius:50%;
  border:1px solid var(--glass-border);background:var(--glass-bg);
  color:var(--accent-primary);cursor:pointer;
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  box-shadow:var(--glass-specular), 0 2px 6px rgba(0,0,0,.04);
  display:flex;align-items:center;justify-content:center;
  transition:transform .16s var(--spring),opacity .2s,background .2s;
}
.stepper__btn:hover{background:var(--glass-bg-elevated)}
.stepper__btn:active{transform:scale(.88)}
.stepper__btn[disabled]{opacity:.3;cursor:default}
.stepper__btn svg{width:15px;height:15px}
.stepper__v{
  min-width:66px;text-align:center;
  font-size:17px;font-weight:600;letter-spacing:-.23px;
  color:var(--text-primary);font-variant-numeric:tabular-nums;
}

/* ---------- 底部 Sheet ---------- */
.sheet-mask{
  position:absolute;inset:0;z-index:50;
  background:rgba(0,0,0,.38);
  opacity:0;pointer-events:none;transition:opacity .3s;
}
.sheet-mask.is-open{opacity:1;pointer-events:auto}
.sheet{
  position:absolute;left:0;right:0;bottom:0;z-index:60;
  background:var(--glass-dock-bg);
  -webkit-backdrop-filter:var(--glass-dock-blur);
  backdrop-filter:var(--glass-dock-blur);
  border-top:1px solid var(--glass-dock-border);
  box-shadow:var(--glass-dock-specular), 0 -12px 48px rgba(0,0,0,.3);
  border-radius:36px 36px 0 0;
  padding:12px 0 38px;
  transform:translateY(100%);
  transition:transform .38s var(--spring);
  max-height:80%;overflow-y:auto;scrollbar-width:none;
}
.sheet::-webkit-scrollbar{display:none}
.sheet.is-open{transform:translateY(0)}
.sheet__grab{
  width:36px;height:5px;border-radius:3px;background:var(--separator-strong);
  margin:0 auto 14px;opacity:.6;
}
.sheet__title{
  font-size:17px;font-weight:600;letter-spacing:-.43px;
  text-align:center;margin:0 0 4px;color:var(--text-primary);
}
.sheet__sub{font-size:13px;text-align:center;color:var(--text-secondary);margin:0 0 6px}
.sheet__list{padding:0 var(--margin-page)}

/* ---------- Toast ---------- */
.toast{
  position:absolute;left:50%;bottom:calc(var(--tabbar-h) + 54px);
  z-index:70;transform:translate(-50%,14px);
  padding:11px 20px;border-radius:999px;
  background:rgba(24,38,48,.86);color:#fff;
  border:1px solid rgba(255,255,255,.2);
  box-shadow:inset 0 1px 1px 0 rgba(255,255,255,.4), 0 12px 36px rgba(0,0,0,.35);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  backdrop-filter:blur(24px) saturate(180%);
  font-size:14px;font-weight:500;white-space:nowrap;
  opacity:0;pointer-events:none;
  transition:opacity .26s,transform .26s var(--spring);
}
html[data-theme="dark"] .toast{
  background:rgba(235,245,250,.92);color:#0C1F29;
  border:1px solid rgba(255,255,255,.6);
  box-shadow:inset 0 1px 1px 0 #ffffff, 0 12px 36px rgba(0,0,0,.5);
}
.toast.is-show{opacity:1;transform:translate(-50%,0)}

/* ---------- 景区详情 Hero ---------- */
.spot-hero{
  width:100%;height:320px;position:relative;overflow:hidden;
  display:flex;flex-direction:column;justify-content:flex-end;
  padding:24px var(--margin-page) 20px;
}
.spot-hero__body{position:relative;z-index:2;color:#fff}

}
.spot-hero__tags{display:flex;align-items:center;gap:6px;flex-wrap:wrap}

/* ---------- 封面渐变底 ---------- */
.p-card__img--hgs,.trip-card__cover--a,.spot-hero--hgs{background:linear-gradient(135deg,#06425C,#2F6F72,#1E7A4D)}
.p-card__img--lg,.trip-card__cover--b,.spot-hero--lg{background:linear-gradient(135deg,#0A506B,#4A90A4,#2C4433)}
.p-card__img--tb,.spot-hero--tb{background:linear-gradient(135deg,#4B3F38,#7D6B5D,#A8630B)}
.p-card__img--qy,.spot-hero--qy{background:linear-gradient(135deg,#1E2D3B,#3E5062,#667D87)}

/* ---------- 空状态 ---------- */
.empty{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:36px var(--margin-page);text-align:center;
}
.empty__ico{
  width:64px;height:64px;border-radius:20px;margin-bottom:14px;
  background:var(--bg-fill);color:var(--text-tertiary);
  display:flex;align-items:center;justify-content:center;
}
.empty__ico svg{width:30px;height:30px}
.empty__t{font-size:17px;font-weight:600;color:var(--text-primary);margin:0 0 5px}
.empty__d{font-size:14px;line-height:1.5;color:var(--text-secondary);margin:0 0 18px;max-width:30ch}

/* ---------- 进度条 ---------- */
.progress{height:6px;border-radius:3px;background:var(--bg-fill);overflow:hidden;margin-top:10px}
.progress__bar{height:100%;width:0;background:var(--accent-primary);border-radius:3px;transition:width .5s ease}

/* ---------- 页面级切换（桌面用，App 外） ---------- */
.stage__nav{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.stage__nav button{
  border:1px solid var(--glass-border);
  background:var(--glass-bg);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  box-shadow:var(--glass-specular);
  color:var(--page-fg);font-family:inherit;font-size:13px;font-weight:500;
  padding:7px 15px;border-radius:999px;cursor:pointer;
  transition:background .2s,color .2s,border-color .2s,transform .16s var(--spring);
}
.stage__nav button:hover{
  background:var(--glass-bg-elevated);
  transform:translateY(-1px);
}
.stage__nav button.is-on{
  background:var(--glass-prominent-bg);
  color:var(--on-accent);
  border-color:var(--glass-prominent-border);
  box-shadow:var(--glass-prominent-specular), 0 4px 16px rgba(0,0,0,.25);
}
.stage__note{font-size:12px;color:var(--page-muted);text-align:center;margin:0}

/* ---------- 响应式移动端自适应 (Mobile Full-Bleed) ---------- */
@media (max-width:520px), (max-height:920px){

}

function calcEndDate(startStr, days) {
  const parts = (startStr || '9/26').split('/').map(Number);
  if (parts.length !== 2 || isNaN(parts[0]) || isNaN(parts[1])) return startStr;
  const year = 2026;
  const d = new Date(year, parts[0] - 1, parts[1] + (Number(days) - 1));
  return `${d.getMonth() + 1}/${d.getDate()}`;
}

function updateEndDateFormat() {
  state.plan.endDate = calcEndDate(state.plan.startDate, state.plan.days);
}

}

/* 重排后按新顺序重算时间轴：顺次累加车程与停留时长（对齐后端 reflow + validate） */
function recomputeTimeline(day){
  const spots = day.items.filter(i=>i.spot);
  const T = s => { const [h,m]=s.split(':').map(Number); return h*60+m; };
  const F = v => String(Math.floor(v/60)).padStart(2,'0')+':'+String(v%60).padStart(2,'0');
  const spotDur = { hgs:150, lg:120, tltb:120, qygz:150, qls:120 };
  let cursor = T('09:00');
  spots.forEach((s,i)=>{
    const travel = i===0 ? 60 : 40;      // 段间车程（演示值）
    cursor += travel;
    const dur = spotDur[s.spot] || 120;
    const start = cursor, end = cursor + dur;
    s.t = `${F(start)} – ${F(end)}`;
    if (s.transit) s.transit.m = `驾车 ${travel} 分钟`;
    cursor = end;
  });
  // 排到 18:00 之后的项剔除（对齐后端 reorder_too_late）
  const dropped = [];
  day.items = day.items.filter(it=>{
    if(!it.spot) return true;
    const start = T(it.t.split(' – ')[0]);
    if (start >= 18*60){ dropped.push(it.n); return false; }
    return true;
  });
  return dropped;
}

/* ==========================================================
   渲染
   ========================================================== */
function render(){
  const c = cur();
  const page = PAGES[c.name] || PAGES.home;
  const canBack = state.stack.length > 1;
  const noTab = !!page.noTab;

  let titleHTML = `<span class="nav-bar__title">${page.title}</span>`;
  if (c.name === 'home') {
    titleHTML = `
      <div class="nav-bar__loc press" data-act="sheet:city">
        ${I.pin}<span>${state.city.name} · ${state.city.weather}</span>
        <span style="display:inline-block;transform:rotate(90deg);font-size:11px;opacity:.6">›</span>
      </div>`;
  }

  document.getElementById('navBar').innerHTML = `
    ${canBack
      ? `<button class="nav-btn press" data-act="back" aria-label="返回">${I.back}</button>`
      : '<span class="nav-btn--ph"></span>'}
    ${titleHTML}
    ${c.name==='detail'||c.name==='me'
      ? `<button class="nav-btn press" data-act="sheet:more" aria-label="更多">${I.menu}</button>`
      : (c.name==='home'
          ? `<button class="nav-btn press" data-act="sheet:filter" aria-label="筛选">${I.filter}</button>`
          : '<span class="nav-btn--ph"></span>')}`;

  document.getElementById('scroll').innerHTML = page.render();
  const sc = document.getElementById('scroll');
  sc.scrollTop = 0;
  // 沉浸式页面（景区详情 Hero）让 Hero 顶到导航栏下方
  sc.classList.toggle('is-immersive', !!page.immersive);
  sc.classList.toggle('has-dock', !!page.dock);

  const tb = document.getElementById('tabBar');
  tb.style.display = noTab ? 'none' : 'grid';
  tb.innerHTML = TABS.map(t=>`
    <button class="tab-bar__item press ${t.k===page.tab?'is-active':''}" data-tab="${t.root}">
      ${t.ic}<span>${t.lb}</span>
    </button>`).join('');

  document.getElementById('stageNav').innerHTML =
    Object.keys(PAGES).map(k=>
      `<button data-screen="${k}" class="${k===c.name?'is-on':''}">${STAGE_LABELS[k]}</button>`).join('');

  const t = document.getElementById('stageTitle');
  if (t) t.textContent = '游迹 App · ' + STAGE_LABELS[c.name];

  // Sheet
  const mask = document.getElementById('sheetMask');
  const sheet = document.getElementById('sheet');
  if (state.sheet){
    const cfg = state.sheet;
    sheet.innerHTML = `
      <div class="sheet__grab"></div>
      <p class="sheet__title">${cfg.title}</p>
      ${cfg.sub?`<p class="sheet__sub">${cfg.sub}</p>`:''}
      <div class="sheet__list">
        ${cfg.items.map(it=>`
          <button class="field press ${it.plain?'':''}" data-act="${it.a}" style="width:100%;background:${it.highlight?'var(--bg-fill)':'none'};border:none;border-radius:${it.highlight?'12px':'0'};text-align:left;font:inherit;padding:${it.highlight?'11px 10px':'13px 0'};margin-bottom:${it.highlight?'4px':'0'}">
            <span class="row" style="gap:11px;width:100%">
              <span style="color:${it.danger?'#FF453A':(it.highlight?'var(--ok)':'var(--accent-primary)')};width:19px;height:19px;flex:none;display:block">${it.ic}</span>
              <span style="flex:1;min-width:0">
                <span style="display:flex;align-items:center;justify-content:space-between;font-size:16px;font-weight:${it.highlight?'600':'500'};color:${it.danger?'#FF453A':'var(--text-primary)'}">
                  <span>${it.lb}</span>
                  ${it.highlight ? `<span style="font-size:12px;color:var(--ok);font-weight:600">当前</span>` : ''}
                </span>
                ${it.d?`<span style="display:block;font-size:12.5px;color:var(--text-secondary);margin-top:1px">${it.d}</span>`:''}
              </span>
            </span>
          </button>`).join('')}
      </div>`;
    mask.classList.add('is-open'); sheet.classList.add('is-open');
  } else {
    mask.classList.remove('is-open'); sheet.classList.remove('is-open');
  }

  // 预算条动画
  requestAnimationFrame(()=>{
    document.querySelectorAll('[data-w]').forEach(el=>{ el.style.width = el.dataset.w + '%'; });
  });
  updateFab();
}

/* 滚动回顶按钮 */
function updateFab(){
  const sc = document.getElementById('scroll');
  const fab = document.getElementById('fab');
  if (fab) fab.classList.toggle('is-show', sc.scrollTop > 400);
}

/* ==========================================================
   交互
   ========================================================== */
// 事件挂在整个 stage：覆盖手机内交互 + 手机外的页面切换按钮
document.getElementById('stage').addEventListener('click', (e)=>{
  const tabB = e.target.closest('[data-tab]');
  if (tabB){
    const r = tabB.dataset.tab;
    if (cur().name !== r){ state.stack=[{name:r}]; closeSheet(); }
    render(); return;
  }
  const scr = e.target.closest('[data-screen]');
  if (scr){ state.stack=[{name:scr.dataset.screen}]; closeSheet(); render(); return; }

  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  const [cmd, arg] = act.split(':');

  switch(cmd){
    case 'back':  back(); return;
    case 'close': closeSheet(); render(); return;
    case 'go':    go(arg); return;

    case 'spot':  go('spot',{id:arg}); return;
    case 'guide': go('guideDetail',{id:arg}); return;

    case 'sheet':
      openSheet(arg);
      render(); return;

    case 'fav': {
      const has = state.favs.has(arg);
      has ? state.favs.delete(arg) : state.favs.add(arg);
      render();
      toast(has ? '已取消收藏' : '已加入收藏');
      return;
    }
    case 'add':   toast('已加入行程，AI 会据此重算路线'); return;
    case 'adopt': toast('已纳入规划依据（待核验内容不作为事实）'); return;
    case 'hero':  toast('全屏查看景区实景'); return;
    case 'toast': toast(arg); return;

    case 'day':   state.detail.day=+arg; state.detail.view='list'; render(); return;
    case 'view':  state.detail.view=arg; render(); return;

    case 'people':{
      state.plan.people = Math.min(9,Math.max(1,state.plan.people + (+arg)));
      render(); return;
    }
    case 'budget':{
      state.plan.budget = Math.min(5000,Math.max(500,state.plan.budget + (+arg)));
      render(); return;
    }
    case 'tag':{
      state.plan.interests.has(arg) ? state.plan.interests.delete(arg) : state.plan.interests.add(arg);
      render(); return;
    }
    case 'mode':  state.plan.mode=arg; render(); return;

    case 'efilter': state.explore.filter=arg; render(); return;
    case 'gfilter': state.guide.filter=arg; render(); return;
    case 'eclear':  state.explore.filter='推荐'; state.explore.q=''; render(); return;
    case 'gclear':  state.guide.filter='为你推荐'; render(); return;

    case 'me':
      if (arg==='login'){ state.login=true; render(); toast('登录成功'); return; }
      if (arg==='logout'){ state.login=false; render(); toast('已退出登录'); return; }
      if (arg==='favs'){ go('favs'); return; }
      if (arg==='trips'){ go('trips'); return; }
      if (arg==='done'){ toast('已完成行程回顾属 V0.2'); return; }
      return;

    case 'prefs':
      if (arg==='city'){ openSheet('city'); render(); return; }
      toast(arg+' 设置'); return;
    case 'city':{
      if (arg==='gps'){
        state.city = CITIES[0]; // 贵阳市
        state.plan.origin = state.city.short;
        closeSheet(); render();
        toast('GPS 定位成功：已更新至贵阳市基准');
        return;
      }
      const found = CITIES.find(c=>c.id===arg);
      if (found){
        state.city = found;
        state.plan.origin = found.short;
        closeSheet(); render();
        toast(`已切换定位至 ${found.name} · ${found.weather}`);
      }
      return;
    }
    case 'toggle':{
      const sw = el.getAttribute('aria-checked')==='true';
      el.setAttribute('aria-checked', sw?'false':'true');
      toast(sw?'已关闭':'已开启'); return;
    }
    case 'generate': runGenerate(); return;
    case 'order': {
      // 提到景区序列最前；对应后端 reorder_day（锁定前缀），时间轴整体重算
      const day = ITINERARY.days[state.detail.day];
      const spots = day.items.filter(i=>i.spot);
      if (!spots.length){ toast('当天没有可排序的景区'); return; }
      const moved = spots[+arg];
      if (!moved){ toast('该项目不可排序'); return; }
      const rest = spots.filter((_,i)=>i!==+arg);
      const firstSpotPos = day.items.findIndex(i=>i.spot);
      // 保留非景区节点（早餐/餐厅/酒店）原位，仅重排景区之间的相对顺序
      const newSpots = [moved, ...rest];
      const rebuilt = [];
      let si = 0;
      day.items.forEach(it => { rebuilt.push(it.spot ? newSpots[si++] : it); });
      day.items = rebuilt;
      const dropped = recomputeTimeline(day);   // 时间轴整体重算
      state.reordered = true;
      closeSheet(); render();
      toast(dropped.length
        ? `已重排时间；「${dropped.join('、')}」已过时段被移除`
        : `已把「${moved.n}」提到最前，时间已重算`);
      return;
    }
    case 'do':
      closeSheet(); render();
      toast(arg==='swap' ? '已替换并重算当天'
          : arg==='reset' ? '已恢复推荐顺序'
          : arg==='remove' ? '已移除并重算当天' : '已完成');
      return;
    case 'item':   openSheet(SHEETS.item(+arg)); render(); return;
  }
});

/* 生成流程 */
let genTimer = null;
function runGenerate(){
  state.generating = true; state.progress = 0;
  go('generating');
  clearInterval(genTimer);
  genTimer = setInterval(()=>{
    state.progress += 5;
    const bar = document.getElementById('pgBar');
    const txt = document.getElementById('pgText');
    if (bar) bar.style.width = state.progress + '%';
    if (txt) txt.textContent = ['解析需求','召回景区','计算路线','按天装包','预算校验'][Math.min(4,Math.floor(state.progress/20))];
    if (state.progress >= 100){
      clearInterval(genTimer);
      setTimeout(()=>{ state.generating=false; state.stack=[{name:'detail'}]; render(); toast('行程已生成'); },420);
    }
  },190);
}

/* 返回顶部 */
document.getElementById('scroll').addEventListener('scroll', updateFab, {passive:true});
document.getElementById('fab').addEventListener('click', ()=>{
  document.getElementById('scroll').scrollTo({top:0,behavior:'smooth'});
});
document.getElementById('sheetMask').addEventListener('click', ()=>{ closeSheet(); render(); });

/* ==========================================================
   双击状态栏切换主题（iOS 原生交互）
   ========================================================== */
(function(){
  const KEY = 'youpji-app-theme';
  const root = document.documentElement;
  const saved = localStorage.getItem(KEY);
  if (saved === 'dark' || saved === 'light') root.setAttribute('data-theme', saved);
  /* 实时输入监听：搜索框丝滑过滤且不丢失焦点 */
document.addEventListener('input', (e)=>{
  if (e.target.id === 'exploreSearch') {
    state.explore.q = e.target.value;
    const clearBtn = e.target.parentElement.querySelector('.search-box__clear');
    if (clearBtn) clearBtn.style.display = state.explore.q ? 'flex' : 'none';
    const listEl = document.getElementById('exploreList');
    const countEl = document.getElementById('exploreListCount');
    if (listEl) {
      const filtered = getFilteredSpots();
      listEl.innerHTML = exploreListItemsHTML(filtered);
      if (countEl) countEl.textContent = `贵阳周边 · ${filtered.length} 个结果`;
    }
  } else if (e.target.id === 'guideSearch') {
    state.guide.q = e.target.value;
    const clearBtn = e.target.parentElement.querySelector('.search-box__clear');
    if (clearBtn) clearBtn.style.display = state.guide.q ? 'flex' : 'none';
    const listEl = document.getElementById('guideList');
    if (listEl) {
      const filtered = getFilteredGuides();
      listEl.innerHTML = guideListItemsHTML(filtered);
    }
  }
});

/* 状态栏双击切深浅色 + 硬件灵动岛动效微弹 */
  document.getElementById('statusBar').addEventListener('dblclick', ()=>{
    const next = (root.getAttribute('data-theme') || 'light') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    localStorage.setItem(KEY, next);
    document.getElementById('statusBar').animate(
      [{transform:'scale(1)'},{transform:'scale(.975)'},{transform:'scale(1)'}],
      {duration:220, easing:'cubic-bezier(.34,1.56,.64,1)'}
    );
    const island = document.getElementById('dynamicIsland');
    if (island) {
      island.animate(
        [{transform:'translateX(-50%) scale(1)'},{transform:'translateX(-50%) scale(1.15, 0.88)'},{transform:'translateX(-50%) scale(1)'}],
        {duration:360, easing:'cubic-bezier(.34,1.56,.64,1)'}
      );
    }
  });
})();

render();
</script>
