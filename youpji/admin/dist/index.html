<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>游迹 Admin — 旅游规划与数据治理后台</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div style="font-size:24px;">🏔️</div>
      <div>
        <h1>游迹 Admin</h1>
        <span>V0.1 闭环</span>
      </div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-item active" data-tab="dashboard">
        <span>📊</span> 仪表盘 (Dashboard)
      </div>
      <div class="nav-item" data-tab="attractions">
        <span>🏞️</span> 景区管理
      </div>
      <div class="nav-item" data-tab="hours-review">
        <span>⏰</span> 营业时段审核
      </div>
      <div class="nav-item" data-tab="data-reviews">
        <span>📝</span> 数据审核任务
      </div>
      <div class="nav-item" data-tab="users">
        <span>👥</span> 用户与角色
      </div>
      <div class="nav-item" data-tab="audit-logs">
        <span>📜</span> 审计留痕
      </div>
      <div class="nav-item" data-tab="settings">
        <span>⚙️</span> 系统设置
      </div>
    </nav>
    <div style="padding:16px;border-top:1px solid rgba(255,255,255,0.1);font-size:12px;color:#94a3b8;">
      贵州第一闭环：贵阳 &rarr; 安顺
    </div>
  </aside>

  <!-- Main Wrapper -->
  <div class="main-wrapper">
    <!-- Topbar -->
    <header class="topbar">
      <div class="topbar-title">数据治理与后台运营系统</div>
      <div class="topbar-user">
        <span style="font-size:14px;color:var(--text-muted);">管理员:</span>
        <b id="current-user-name" style="font-size:14px;">-</b>
        <button class="btn btn-outline btn-sm" id="logout-btn">退出</button>
      </div>
    </header>

    <!-- Content Body -->
    <main class="content-body" id="view-container">
      <!-- Dynamic View Injected Here -->
    </main>
  </div>

  <!-- Login Modal -->
  <div class="modal-overlay" id="login-modal" style="display:none;">
    <div class="modal-content" style="max-width:400px;">
      <div class="modal-header">
        <h3 style="font-size:16px;font-weight:600;">管理员登录</h3>
      </div>
      <form id="login-form">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label">手机号 / 邮箱</label>
            <input type="text" id="login-account" class="input" style="width:100%;" placeholder="admin 账号" required />
          </div>
          <div class="form-group">
            <label class="form-label">密码</label>
            <input type="password" id="login-password" class="input" style="width:100%;" placeholder="••••••••" required />
          </div>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-primary" style="width:100%;">登录后台</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toast-container"></div>

  <script src="app.js"></script>
</body>
</html>
